/* ---------------------------------------------------------------
   14. Screen: fictional character builder
   --------------------------------------------------------------- */
function ScreenFictional(){
  const F=S.fic;

  const tiles=(list,sel,act,colour,extra)=> '<div class="tiles'+(extra||'')+'">'+list.map(o=>{
    const on = Array.isArray(sel) ? sel.includes(o.label) : sel===o.label;
    return '<button class="tile tile-'+colour+(on?' on-'+colour:'')+'" data-act="'+act+'" data-val="'+esc(o.label)+'"'+
      (F.generating?' disabled':'')+'>'+
      '<div class="em">'+o.emoji+'</div><div class="nm">'+esc(o.label)+'</div>'+
      '<div class="ds">'+esc(o.description||o.age||'')+'</div>'+
      (on&&Array.isArray(sel)?'<div class="chk center">'+I('check',20)+'</div>':'')+
    '</button>';
  }).join('')+'</div>';

  return '<div class="screen" style="background:linear-gradient(135deg,var(--purple-50),var(--pink-50) 50%,var(--blue-50));padding:2rem 1rem">'+
    TopBar(true)+
    '<div class="wrap w-4xl" style="padding:0">'+
      '<div class="mb-6"><button data-act="go" data-step="choice" style="color:var(--purple-600);font-weight:500">\u2190 Back to Options</button></div>'+
      '<div style="background:#fff;border-radius:.75rem;box-shadow:var(--shadow-xl);padding:2rem">'+
        '<div class="row mb-6"><span style="background:var(--purple-100);color:var(--purple-600);padding:.75rem;border-radius:9999px;margin-right:1rem;display:inline-flex">'+I('sparkles',32)+'</span>'+
          '<div><h2 class="h2-dark" style="margin:0">Create a Fictional Character</h2>'+
          '<p class="sub-dark mt-2">Build your own unique character by selecting options below</p></div></div>'+

        '<div class="stack gap-6">'+
          '<div><label class="label-lg">1. Character Name *</label>'+
            '<input class="input" id="fic-name" data-bind="fic.name" value="'+esc(F.name)+'"'+
            (F.generating?' disabled':'')+' placeholder="e.g., Captain Nova, Professor Elm, Luna Starlight..." /></div>'+

          '<div><label class="label-lg">2. Personality Traits * (Choose up to 3)</label>'+
            tiles(PERSONALITY_TRAITS,F.traits,'ficTrait','purple')+'</div>'+

          '<div><label class="label-lg">3. Occupation *</label>'+
            tiles(OCCUPATIONS,F.occupation,'ficOcc','blue')+'</div>'+

          '<div><label class="label-lg">4. Setting/World *</label>'+
            tiles(SETTINGS_OPTS,F.setting,'ficSet','green')+'</div>'+

          '<div><label class="label-lg">5. Age Appearance (Optional)</label>'+
            tiles(APPEARANCE_OPTIONS,F.appearance,'ficAge','amber',' four')+'</div>'+

          '<div><label class="label-lg">6. Special Ability (Optional)</label>'+
            tiles(SPECIAL_ABILITIES,F.ability,'ficAbil','pink')+'</div>'+

          '<div><label class="label-lg">7. Additional Details (Optional)</label>'+
            '<textarea class="textarea" data-bind="fic.details" rows="4"'+(F.generating?' disabled':'')+
            ' placeholder="Add any other details about your character... (e.g., has a pet dragon, loves reading, afraid of heights, etc.)">'+esc(F.details)+'</textarea></div>'+

          '<div style="padding-top:1rem">'+
            '<button class="btn btn-grad-pb btn-full" style="padding:1rem 2rem;font-size:1.125rem;font-weight:600" '+
              'data-act="ficGenerate"'+((!canGenerate||F.generating)?' disabled':'')+'>'+
              (F.generating?'<span class="spin"></span>Generating Your Character\u2026'
                           :I('wand',24)+'Generate Character'+I('chev',24))+'</button>'+
            (F.generating?progressBlock('Creating your character\u2026',F.progress,'',true):'')+
            (!canGenerate&&!F.generating?'<p class="mt-3 small muted text-center">Please complete all required fields (*) to generate your character</p>':'')+

      '</div>'+
    '</div>'+

}

function profBlock(title,text){
  if(!text) return '';
  return '<div><h4 style="font-weight:500;margin-bottom:.5rem">'+esc(title)+'</h4>'+
    '<p class="small" style="color:var(--gray-700);line-height:1.7;white-space:pre-wrap">'+esc(text)+'</p></div>';
}
function profList(title,items){
  if(!items||!items.length) return '';
  return '<div><h4 style="font-weight:500;margin-bottom:.5rem">'+esc(title)+'</h4>'+
    '<ul class="small" style="color:var(--gray-700);list-style:disc;padding-left:1.25rem;list-style-position:outside">'+
    items.map(x=>'<li style="margin-bottom:.25rem">'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')+'</ul></div>';
}

/* image uploader block (portrait / background) */
function imageUploader(o){
  const cam = S.creator.camera.open===o.slot;
  const head = '<div><h4 style="font-weight:500;margin-bottom:.5rem">'+esc(o.label)+'</h4>'+
    '<p class="small muted2 mb-4">'+esc(o.description)+'</p></div>';
  if(cam){
    return '<div class="stack gap-4">'+head+
      '<video class="cam" id="cam-'+o.slot+'" autoplay playsinline muted></video>'+
      '<div class="row gap-3">'+
        '<button class="btn btn-green flex1" data-act="capture" data-slot="'+o.slot+'">'+I('cam',20)+'Capture Photo</button>'+
        '<button class="btn btn-gray flex1" data-act="stopCam">'+I('x',20)+'Cancel</button>'+
      '</div></div>';
  }
  if(o.current){
    return '<div class="stack gap-4">'+head+
      '<div><div class="img-preview"><img src="'+esc(o.current)+'" alt="'+esc(o.label)+'" /></div>'+
      '<div class="between mt-2 small muted2"><span>Image ready</span><div class="row gap-2">'+
        '<button data-act="genImage" data-slot="'+o.slot+'" class="row gap-1" style="color:var(--purple-600);font-weight:500"'+
          (o.generating?' disabled':'')+'>'+
          (o.generating?'<span class="spin sm"></span>':I('refresh',16))+'Regenerate</button>'+
        '<button data-act="rmImage" data-slot="'+o.slot+'" style="color:var(--red-600);font-weight:500">Remove</button>'+
      '</div></div></div></div>';
  }
  return '<div class="stack gap-4">'+head+
    '<div class="drop-zone plain" data-drop="'+o.slot+'">'+
      '<div class="center mb-3" style="color:var(--gray-400)">'+I('image',32)+'</div>'+
      '<div class="stack gap-2"><p class="small" style="font-weight:500;color:var(--gray-700)">'+
      'Drop your image here, or <span class="file-link" data-act="browseImage" data-slot="'+o.slot+'">browse files</span></p>'+
      '<p class="tiny muted">Supports JPEG, PNG, WebP up to 10MB</p></div>'+
    '</div>'+
    '<div class="row gap-3">'+
      '<button class="btn btn-amber flex1" data-act="browseImage" data-slot="'+o.slot+'">'+I('upload',20)+'Upload Photo</button>'+
      '<button class="btn btn-blue flex1" data-act="startCam" data-slot="'+o.slot+'">'+I('cam',20)+'Take Photo</button>'+
    '</div>'+
    '<button class="btn btn-grad-pb btn-full" data-act="genImage" data-slot="'+o.slot+'"'+(o.generating?' disabled':'')+'>'+
      (o.generating?'<span class="spin sm"></span>Generating AI Portrait\u2026':I('refresh',20)+
        (o.slot==='avatar'?'Generate AI Portrait':'Generate AI Background'))+'</button>'+
  '</div>';
}

/* Repaint only the chat header controls that change with audio state. */
function paintChatControls(){
  if(S.step!=='chat') return;
  const b=$('#btn-audio');
  if(b){
    b.className='icon-btn '+(S.chat.playing?'ib-blue':'ib-gray');
    b.innerHTML = S.chat.playing?I('vol2',22):I('play',22);
    b.disabled = !(S.chat.audio||S.chat.playing);
    b.title = S.chat.playing?'Pause Audio':'Play Audio';
  }
}
function appendMessage(m){
  S.messages.push(m);
  const list=$('#msg-list');
  if(list){
    const d=document.createElement('div');
    d.innerHTML=msgHtml(m);
    list.appendChild(d.firstChild);
    scrollChat();
  }
  saveLocalSoon();
  if(S.messages.length===2){ const st=$('.chat-body .mb-6'); if(st) st.remove(); }
}
function setTyping(on){
  S.chat.typing=on;
  const t=$('#typing'); if(t) t.classList.toggle('hidden',!on);
  const send=$('#btn-send'); if(send) send.disabled = on || !S.chat.input.trim();
  const inp=$('#chat-text'); if(inp) inp.disabled=on;
  if(on) scrollChat();
}
function scrollChat(){
  const end=$('#chat-end');
  if(end) end.scrollIntoView({behavior:'smooth',block:'end'});
}

/* ---------------------------------------------------------------
   17. Modals
   --------------------------------------------------------------- */
function renderModals(){
  const host=$('#modals');
  if(!S.modal){ host.innerHTML=''; return; }
  host.innerHTML =
    S.modal==='ai'      ? ModalAI() :
    S.modal==='key'     ? ModalKey() :
    S.modal==='privacy' ? ModalPrivacy() :
    S.modal==='share'   ? ModalShare() :
    S.modal==='library' ? ModalLibrary() :
    S.modal==='hostbridge' ? ModalHostBridge() : '';
  const first=$('#modals .modal');
  if(first) first.focus();
}

/**
 * Shown when the app is hosted on the web and Ollama is unreachable. Chromium 142+
 * treats a call from a public page to localhost as a local network request and
 * blocks it until the user grants permission, which is almost always the real cause.
 */
function lnaPanel(){
  const st = S.ai.lna || 'unknown';
  const badge = st==='granted' ? 'permission granted'
              : st==='denied'  ? 'permission denied'
              : st==='prompt'  ? 'permission not granted yet'
              : '';
  return '<div class="note note-blue" style="padding:.75rem 1rem">'+
    '<p class="tiny" style="font-weight:600;margin:0 0 .5rem">Reaching Ollama from a hosted page'+
      (badge?' \u2014 '+esc(badge):'')+'</p>'+
    '<p class="tiny" style="margin:0 0 .5rem">This copy is served from <code>'+esc(EMBED.origin)+'</code>, '+
      'so your browser will not let it talk to your own machine until you allow it. Two steps, once per browser:</p>'+
    '<ol class="tiny" style="margin:0;padding-left:1.1rem">'+
      '<li style="margin-bottom:.35rem">Start Ollama so it accepts this page:<br>'+
        '<code>OLLAMA_ORIGINS='+esc(EMBED.origin&&EMBED.origin!=='null'?EMBED.origin:'*')+' ollama serve</code>'+
        ' &nbsp;(or just <code>OLLAMA_ORIGINS=*</code>)</li>'+
      '<li style="margin-bottom:.35rem">Press <b>Allow local network access</b> below, then choose <b>Allow</b> in the '+
        'browser prompt. If no prompt appears, click the icon at the left of the address bar, find '+
        '<b>Local network access</b>, and switch it on.</li>'+
    '</ol>'+
    (EMBED.framed
      ? '<p class="tiny" style="margin:.5rem 0 0">Because this app sits inside another app, every frame in the chain '+
        'also needs <code>allow="local-network-access"</code> on its iframe tag.</p>'
      : '')+
    '<div class="field-row mt-3">'+
      '<button class="btn btn-blue btn-sm flex1" data-act="grantLocalNetwork">Allow local network access</button>'+
    '</div>'+
    '<p class="tiny muted mt-2">Rather not bother? Download this file and open it from your own machine \u2014 Ollama '+
      'then works with no permission at all. WebLLM and the cloud providers are unaffected either way.</p>'+
  '</div>';
}

  const rows = rep.problems.map(p=>

          '<button class="btn btn-blue btn-sm nowrap" data-act="refreshModels">'+

      '<div class="note note-'+(A.ollamaUp?'green':'amber')+'" style="padding:.75rem 1rem"><p class="tiny">'+
        (A.ollamaUp

          : 'Not connected yet. Install Ollama, run <code>ollama pull llama3.2</code>, then start it with '+
            '<code>OLLAMA_ORIGINS=* ollama serve</code> so this page is allowed to talk to it.')+

        (gpu ? 'WebGPU is available. The first run downloads the model into this browser (roughly 0.6\u20132 GB), then it works offline.'
             : 'This browser has no WebGPU, so WebLLM cannot run. Use Chrome or Edge 113+, or switch to Ollama.')+

      '<div class="field-row"><button class="btn btn-blue btn-sm flex1" data-act="refreshModels">'+

        (A.webllm.loading?'<span class="spin sm"></span>':I('cloud',16))+'Download model now</button></div>'+
      (A.webllm.loading||A.webllm.progress>0
        ? '<div><div class="progress"><i id="webllm-bar" style="width:'+A.webllm.progress+'%"></i></div>'+
          '<p class="tiny muted mt-2" id="webllm-text">'+esc(A.webllm.text||'')+'</p></div>' : '');
  }
  else{
    const shown=A.showKey[p];
    body =
      '<div><label class="label">'+esc(meta.name)+' API key</label>'+
        '<div class="pw-wrap"><input class="input" type="'+(shown?'text':'password')+'" autocomplete="off" '+

        esc(meta.keyUrl.replace('https://',''))+'</a>. '+
        'It is saved to the shared vault <code>'+DV_VAULT+'</code>, so your other Digital Vector apps can reuse it.</p></div>'+
      '<button class="btn btn-blue btn-sm btn-full" data-act="refreshModels"'+(!A.keys[p]?' disabled':'')+'>'+

      : '<div class="note note-gray" style="padding:.625rem .875rem"><p class="tiny">'+

const SCREENS = {
  welcome:ScreenWelcome, choice:ScreenChoice, upload:ScreenUpload,
  fictional:ScreenFictional, character:ScreenCharacter, chat:ScreenChat
};
function render(){
  const focusId = document.activeElement && document.activeElement.id;
  const sel = (document.activeElement && 'selectionStart' in document.activeElement)
    ? document.activeElement.selectionStart : null;
  const root=$('#root');
  root.innerHTML = (SCREENS[S.step]||ScreenWelcome)();
  renderModals();
  if(focusId){
    const back=document.getElementById(focusId);
    if(back && back.focus){
      back.focus();
      if(sel!=null && 'setSelectionRange' in back){ try{ back.setSelectionRange(sel,sel); }catch(e){} }
    }
  }
  if(S.step==='chat') scrollChat();
  attachCamera();
  saveLocalSoon();
}
function paintProgress(pct){
  const f=$('#prog-fill'); if(f) f.style.width=pct+'%';
  const p=$('#prog-pct'); if(p) p.textContent=pct+'%';
}
function openModal(name,data){ S.modal=name; S.modalData=data||{}; renderModals(); }
function closeModal(){ S.modal=null; S.modalData={}; renderModals(); }

   19. Source collection helpers
   --------------------------------------------------------------- */
function addSource(item){
  S.upload.collected.push(item);
  S.upload.showCollected=true;
  saveLocalSoon();
}
async function runWithProgress(label, work){
  const U=S.upload;
  U.processing=true; U.progress=0; U.error=''; render();
  const t=ticker(v=>{ U.progress=v; paintProgress(v); },10,90,200);
  try{
    const out=await work();
    t.done(); U.progress=100; paintProgress(100);
    await sleep(400);
    return out;
  }finally{
    t.stop(); U.processing=false;
  }
}

/* ---- PDF ---- */
async browsePdf(){ const f=await pickFile('.pdf,application/pdf'); if(f) handlePdfFile(f); },
removeFile(){ S.upload.file=null; S.upload.progress=0; S.upload.error=''; render(); },
async pdfUrl(){
  const U=S.upload;
  const url=U.pdfUrl.trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){ U.error='Enter a full URL starting with http:// or https://'; render(); return; }
  U.downloading=true;
  try{
    const blob = await runWithProgress('Downloading', async ()=>{
      let b=null;
      try{
        const r=await fetch(url,{mode:'cors',headers:{Accept:'application/pdf,*/*'}});
        if(!r.ok) throw new Error('HTTP '+r.status);
        b=await r.blob();
        if(!b.type.includes('pdf') && !/\.pdf$/i.test(url)) throw new Error('That URL does not point to a PDF.');
      }catch(e){
        for(const proxy of ['https://corsproxy.io/?'+encodeURIComponent(url),
                            'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]){
          try{
            const r=await fetch(proxy,{headers:{Accept:'application/pdf,*/*'}});
            if(r.ok){ const bb=await r.blob(); if(bb.size>0){ b=bb; break; } }
          }catch(_){}
        }
      }
      if(!b || b.size===0) throw new Error('The PDF could not be downloaded. The site may block direct access — download it and upload the file instead.');
      const file=new File([b], url.split('/').pop()||'downloaded.pdf', {type:'application/pdf'});
      const res=await PDFProcessor.extractTextFromFile(file);
      addSource({ type:'pdf', content:res.text, label:'PDF from URL: '+(file.name),
        metadata:{ numPages:res.numPages, title:res.title, author:res.author } });
      return res;
    });
    U.pdfUrl=''; U.downloading=false; render();
    toast('PDF added ('+blob.numPages+' pages)','ok');
  }catch(err){
    U.downloading=false; U.error=err.message||String(err); render();
  }
},

async processPaste(){
  const U=S.upload;

/* ---- website ---- */
async fetchSite(){
  const inp=$('#site-url'); if(!inp) return;
  const url=inp.value.trim();
  const errBox=$('#site-error');
  const showErr=m=>{ if(errBox) errBox.innerHTML='<div class="note note-red row gap-2" style="align-items:flex-start">'+
    '<span style="color:var(--red-600);flex-shrink:0">'+I('alert',18)+'</span><p class="small">'+esc(m)+'</p></div>'; };
  if(!url){ showErr('Please enter a URL'); return; }
  if(!/^https?:\/\/.+/i.test(url)){ showErr('Please enter a valid URL starting with http:// or https://'); return; }
  if(errBox) errBox.innerHTML='<div class="row gap-2 small muted"><span class="spin sm"></span>Extracting content\u2026</div>';
  try{
    let html=null;
    try{
      const r=await fetch(url);
      if(r.ok) html=await r.text();
    }catch(e){}
    if(!html){
      for(const proxy of ['https://api.allorigins.win/raw?url='+encodeURIComponent(url),
                          'https://corsproxy.io/?'+encodeURIComponent(url)]){
        try{ const r=await fetch(proxy); if(r.ok){ const t=await r.text(); if(t&&t.length>200){ html=t; break; } } }catch(_){}
      }
    }
    if(!html) throw new Error('That site refused the request. Copy the text you need and use the Paste Text tab.');
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,style,nav,footer,header,noscript').forEach(el=>el.remove());
    const main=doc.querySelector('main')||doc.querySelector('article')||doc.body;
    const cleaned=(main?main.textContent:'').replace(/\s+/g,' ').trim();
    if(!cleaned || cleaned.length<100) throw new Error('Could not extract sufficient content from the website');
    S.upload.websites.push({ url, content:cleaned });
    render();
    toast('Extracted '+num(cleaned.length)+' characters','ok');
  }catch(err){
    showErr(err.message||'Failed to extract content from website.');
  }
},
rmSite(el){ S.upload.websites.splice(+el.dataset.i,1); render(); },
async processSites(){
  const U=S.upload;

      .join('\n\n'+'='.repeat(60)+'\n\n');

},

/* ---------------------------------------------------------------
   21. Flow helpers
   --------------------------------------------------------------- */
function seedCreatorFromSource(){
  const src=S.source, C=S.creator;
  if(!src) return;
  // Anything left over from a previous character is scrubbed first, so an empty
  // extraction result cannot fall through to a stale value.
  const prev=scrubForm(C.form);
  if(src.extractedBasicInfo){
    const i=scrubForm(src.extractedBasicInfo);
    C.form={
      name:i.name||prev.name, birthYear:i.birthYear||prev.birthYear,
      deathYear:i.deathYear||prev.deathYear, nationality:i.nationality||prev.nationality,
      occupation:i.occupation||prev.occupation, timePeriod:i.timePeriod||prev.timePeriod
    };
  }else{
    C.form=prev;
    // src.author is PDF metadata or a label this app generated. "Multiple Sources"
    // is not a person, so only take it when it plausibly names one.
    const author=String(src.author||'').trim();
    const synthetic=/^(multiple sources|ai character generator|unknown|anonymous|n\/?a|untitled)$/i;
    if(author && !synthetic.test(author) && !looksLikeJunk(author)){
      const nm=cleanField(author,80);
      if(nm) C.form.name=nm;
    }
  }
  if(src.generatedPortrait) C.avatar=src.generatedPortrait;
  C.profile=null;
}
function startChat(character, skipSeed){
  S.character=character;
  addToLibrary(character);
  S.messages=[{
    id:uid('msg'), sender:'character',
    content:'Greetings! I am '+character.name+'. I lived during '+character.timePeriod+
      ' and was known for '+character.occupation+'. I\u2019m here to share my experiences and knowledge with you. '+
      'What would you like to know about my life or my era?',
    timestamp:new Date().toISOString(), type:'text'
  }];
  S.chat.input=''; S.chat.typing=false; S.chat.images=[];
  S.step='chat'; window.scrollTo(0,0); render();
}
async function handlePdfFile(file){

  U.file=file;

    addSource({ type:'pdf', content:res.text, label:'PDF: '+file.name,
      metadata:{ numPages:res.numPages, title:res.title, author:res.author } });
    U.file=null; render();
    toast('PDF added ('+res.numPages+' pages)','ok');
  }catch(err){
    U.error=err.message||'Failed to process PDF file'; U.file=null; render();
  }

/* ---- messaging ---- */
const IMAGE_KEYWORDS = ['picture','image','show me','generate','create','draw','paint','illustration',
  'visual','depict','sketch','portrait','scene'];

async function sendMessage(){
  const C=S.chat, ch=S.character;
  const content=(C.input||'').trim();
  if(!content || C.typing) return;
  const rd=AI.ready();
  if(!rd.ok){ toast(rd.msg,'err'); needsSetup(); return; }

  const isImageRequest = IMAGE_KEYWORDS.some(k=>content.toLowerCase().includes(k)) && AI.canImage();

  appendMessage({ id:uid('msg'), sender:'user', content, timestamp:new Date().toISOString(), type:'text' });
  C.input='';
  const inp=$('#chat-text'); if(inp) inp.value='';
  setTyping(true);

  if(isImageRequest){
    try{
      const prompt=await Service.imagePrompt(content, ch);
      const url=await AI.image(prompt, ch.timePeriod+' '+ch.name);
      appendMessage({ id:uid('msg'), sender:'character', content:'I have created this visual for you as requested.',
        timestamp:new Date().toISOString(), type:'image', imageUrl:url });
    }catch(err){
      appendMessage({ id:uid('msg'), sender:'character',
        content:'I cannot create that visual at the moment. '+(err.message||''),
        timestamp:new Date().toISOString(), type:'text' });
    }
    setTyping(false);
    return;
  }

  try{
    const history=S.messages.slice(0,-1);
    const reply=await Service.generateResponse(ch, history, content);
    appendMessage({ id:uid('msg'), sender:'character', content:reply||'\u2026',
      timestamp:new Date().toISOString(), type:'text' });
    if(S.voice.enabled && reply){
      try{ await AI.speak(reply, S.voice.voice, S.voice.speed, S.voice.volume); }
      catch(e){ /* speech is a bonus, not a blocker */ }
    }
  }catch(err){
    appendMessage({ id:uid('msg'), sender:'character',
      content:'I seem to be having difficulty responding. '+(err.message||'Could you please try again?'),
      timestamp:new Date().toISOString(), type:'text' });
  }
  setTyping(false);
}

async function generateSceneImage(userPrompt){
  const ch=S.character;
  if(!AI.canImage()){ toast(AI.imageHint(),'warn',5000); openModal('ai'); return; }
  setTyping(true);
  try{
    const prompt=await Service.imagePrompt(userPrompt, ch);
    const url=await AI.image(prompt, ch.timePeriod+' '+ch.name);
    S.chat.images.push(url);
    appendMessage({ id:uid('msg'), sender:'character', content:'I have created this visual for you as requested.',
      timestamp:new Date().toISOString(), type:'image', imageUrl:url });
  }catch(err){
    appendMessage({ id:uid('msg'), sender:'character',
      content:'I cannot create that visual at the moment. '+(err.message||''),
      timestamp:new Date().toISOString(), type:'text' });
  }finally{
    setTyping(false);
  }
}

/* ---- speech recognition ---- */
let recognition=null;
function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  recognition=new SR();
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.lang='en-US';
  recognition.onresult=e=>{
    const t=e.results[0][0].transcript;
    S.chat.input=t; S.chat.listening=false;
    const i=$('#chat-text'); if(i){ i.value=t; }
    const b=$('#btn-send'); if(b) b.disabled=false;
    render();
  };
  recognition.onerror=()=>{ S.chat.listening=false; render(); };
  recognition.onend=()=>{ if(S.chat.listening){ S.chat.listening=false; render(); } };
}
function startListening(){
  if(!recognition){ toast('This browser has no speech recognition. Type your message instead.','warn'); return; }
  if(S.chat.listening) return;
  S.chat.listening=true; render();
  try{ recognition.start(); }catch(e){ S.chat.listening=false; render(); }
}
function stopListening(){
  if(recognition && S.chat.listening){ try{ recognition.stop(); }catch(e){} }
  S.chat.listening=false; render();
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act;
  if(!ACT[act]) return;
  if(t.tagName==='BUTTON' && t.disabled) return;
  if(t.tagName!=='SELECT' && t.type!=='radio' && t.type!=='checkbox' && t.type!=='range'){
    if(t.tagName!=='A') e.preventDefault();
  }
  ACT[act](t,e);
});
document.addEventListener('change', e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  if(t.tagName==='SELECT' || t.type==='radio' || t.type==='checkbox'){ ACT[t.dataset.act]?.(t,e); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset && t.dataset.act && (t.type==='range')){ ACT[t.dataset.act]?.(t,e); return; }
  if(!t.dataset || !t.dataset.bind) return;
  setPath(S, t.dataset.bind, t.value);
  // Live side-effects that must not trigger a full re-render.
  if(t.dataset.bind==='upload.manualText'){
    const n=t.value.length;
    const c=$('#char-count');
    if(c){ c.textContent=num(n)+' / '+num(MAX_CHARACTERS)+' characters';
           c.style.color = n>MAX_CHARACTERS*0.9 ? 'var(--orange-600)' : ''; }
    const pb=$('#btn-process-manual');
    if(pb) pb.disabled = !t.value.trim() || S.upload.processing || n>MAX_CHARACTERS;
    S.upload.autoSave='unsaved';
    clearTimeout(manualSaveTimer);
    manualSaveTimer=setTimeout(()=>{
      S.upload.autoSave='saving';
      try{ localStorage.setItem('hfchat.manualText', S.upload.manualText); }catch(_){}
      setTimeout(()=>{ S.upload.autoSave='saved'; if(S.step==='upload'&&S.upload.tab==='manual') render(); },400);
    },2000);
  }
  if(t.dataset.bind==='upload.pasteText'){
    const c=$('#paste-count'); if(c) c.textContent=num(t.value.length)+' characters';
    const pb=$('#btn-process-paste');
    if(pb) pb.disabled = !t.value.trim() || S.upload.processing;
  }
  if(t.dataset.bind==='chat.input'){
    const b=$('#btn-send'); if(b) b.disabled = !t.value.trim() || S.chat.typing;
  }
  if(t.dataset.bind && t.dataset.bind.indexOf('ai.keys.')===0){
    _openaiRaw=null;
    // Keep the shared vault in step so sibling apps pick the key up.
    clearTimeout(vaultSaveTimer);
    const which=t.dataset.bind.split('.').pop(), val=t.value;
    vaultSaveTimer=setTimeout(()=>KeyVault.set(which, val), 500);
    // The button's disabled state is set at render time; keep it honest without
    // re-rendering the modal, which would steal focus mid-keystroke.
    const btn=$('#modals [data-act="refreshModels"]');
    if(btn) btn.disabled = !t.value.trim();
    saveLocalSoon();
    return;
  }
  saveLocalSoon();
});
let manualSaveTimer=null;
let vaultSaveTimer=null;

/* Another tab — or another Digital Vector app — saved a key. Adopt it. */
window.addEventListener('storage', e=>{
  if(e.key!==DV_VAULT && e.key!==DV_OPENAI_KEY) return;
  const before={...S.ai.keys};
  KeyVault.hydrate(S.ai.keys);
  const changed=['openai','anthropic','gemini'].some(p=>before[p]!==S.ai.keys[p]);
  if(!changed) return;
  _openaiRaw=null;
  updateAIStatus();
  if(S.modal==='ai'||S.modal==='key') renderModals();
  if(S.ai.keys.openai && !before.openai) toast('Picked up an OpenAI key saved by another app.','ok',4000);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.modal){ closeModal(); return; }
  if(e.key!=='Enter') return;
  const t=e.target;
  if(!t.dataset || !t.dataset.enter) return;
  if(t.tagName==='TEXTAREA') return;
  e.preventDefault();
  ACT[t.dataset.enter]?.(t,e);
});
/* drag and drop */
['dragenter','dragover','dragleave','drop'].forEach(type=>{
  document.addEventListener(type, e=>{
    const zone=e.target.closest('[data-drop]');
    if(!zone) return;
    e.preventDefault(); e.stopPropagation();
    if(type==='dragenter'||type==='dragover') zone.classList.add('active');
    else zone.classList.remove('active');
    if(type==='drop'){
      const f=e.dataTransfer.files && e.dataTransfer.files[0];
      if(!f) return;
      const slot=zone.dataset.drop;
      if(slot==='pdf') handlePdfFile(f); else handleImageFile(f,slot);
    }
  }, false);
});
window.addEventListener('beforeunload', ()=>{ saveLocal(); stopCamera(); });

/* ---------------------------------------------------------------
   23. Boot
   --------------------------------------------------------------- */
async function boot(){
  _appReady=true;
  // Say hello to the host early, so a bridge is ready before the first probe.
  if(EMBED.framed) HOST.hello();

  loadLibrary();
  restoreLocal();

  // A host can pin the Ollama address, the provider or the model on the URL:
  //   index.html#ollama=http://192.168.1.20:11434&provider=ollama
  const pOllama=embedParam('ollama'), pProv=embedParam('provider'), pModel=embedParam('model');
  if(pOllama) S.ai.ollamaUrl=tidyBase(pOllama);
  if(pProv && PROVIDERS[pProv]){ S.ai.provider=pProv; S.ai.pinned=true; }
  if(pModel && PROVIDERS[S.ai.provider]) S.ai.model[S.ai.provider]=pModel;

  // Anything the host pushed down before the app finished loading.
  if(_pendingHostConfig){ const c=_pendingHostConfig; _pendingHostConfig=null; applyHostConfig(c); }
  HOST.inbox.splice(0).forEach(applyHostConfig);

  // The shared vault is the source of truth for keys, ahead of any saved session.
  KeyVault.hydrate(S.ai.keys);
  try{ const mt=localStorage.getItem('hfchat.manualText'); if(mt && !S.upload.manualText) S.upload.manualText=mt; }catch(e){}
  initRecognition();
  systemVoices();
  render();

  // Hosted on the web? Note whether the browser has already been told this site
  // may reach the local machine, so AI setup can say so.
  if(servedFromWeb()) lnaState().then(st=>{ S.ai.lna=st; });

  // Local first, cloud only if local cannot run: Ollama -> WebLLM -> OpenAI.
  if(!S.ai.probed){
    S.ai.probed=true;
    await autoSelectProvider();
    saveLocalSoon();
  }
}
boot();

})();
</script>
