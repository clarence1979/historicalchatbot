  --blue-50:#eff6ff; --blue-100:#dbeafe; --blue-200:#bfdbfe; --blue-500:#3b82f6;
  --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-800:#1e40af; --blue-900:#1e3a8a;
  --green-50:#f0fdf4; --green-100:#dcfce7; --green-200:#bbf7d0; --green-500:#22c55e;
  --green-600:#16a34a; --green-700:#15803d; --green-800:#166534; --green-900:#14532d;
  --purple-50:#faf5ff; --purple-100:#f3e8ff; --purple-300:#d8b4fe; --purple-500:#a855f7;
  --purple-600:#9333ea; --purple-700:#7e22ce;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-200:#fecaca; --red-500:#ef4444;
  --red-600:#dc2626; --red-700:#b91c1c; --red-800:#991b1b;
  --pink-50:#fdf2f8; --pink-500:#ec4899;
  --orange-600:#ea580c;
  --slate-800:#1e293b; --slate-900:#0f172a;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --shadow-2xl:0 25px 50px -12px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  color:var(--gray-900); background:var(--gray-50); -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding-left:0;list-style-position:inside}
:focus-visible{outline:2px solid var(--amber-500);outline-offset:2px}

/* ---------- layout scaffolding ---------- */
.screen{min-height:100vh;position:relative}
.screen-pad{padding:3rem 0}
.bg-photo{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
  background-color:#2b2119;background-blend-mode:normal}
.bg-photo::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
.bg-photo.dim60::after{background:rgba(0,0,0,.6)}
.wrap{position:relative;z-index:10;margin:0 auto;padding:0 1.5rem;width:100%}
.w-4xl{max-width:56rem}.w-5xl{max-width:64rem}.w-6xl{max-width:72rem}
.center{display:flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}
.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.mb-6{margin-bottom:1.5rem}.mb-8{margin-bottom:2rem}
.flex1{flex:1;min-width:0}
.hidden{display:none !important}
.text-center{text-align:center}
.nowrap{white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breakword{overflow-wrap:anywhere}

/* ---------- typography ---------- */
.drop{text-shadow:0 2px 6px rgba(0,0,0,.55)}
.drop-sm{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hero-title{font-size:clamp(2rem,7vw,3.75rem);font-weight:800;color:#fff;line-height:1.1;margin-bottom:1rem;letter-spacing:-.02em}
.hero-title span{display:block;color:var(--amber-300)}
.hero-sub{font-size:clamp(1rem,2.4vw,1.25rem);color:var(--gray-100);max-width:42rem;margin:0 auto 2rem;line-height:1.65}
.h2-light{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:700;color:#fff;margin-bottom:1rem}
.h2-dark{font-size:clamp(1.5rem,3.4vw,1.875rem);font-weight:700;color:var(--gray-900);margin-bottom:.5rem}
.lead-light{font-size:1.125rem;color:var(--gray-100)}
.sub-dark{color:var(--gray-600);font-size:.95rem}
.sec-title{font-size:1.125rem;font-weight:600;color:var(--gray-900);margin-bottom:.75rem}
.sec-title.xl{font-size:1.25rem;margin-bottom:1rem}
.tiny{font-size:.75rem}
.small{font-size:.875rem}
.muted{color:var(--gray-500)}
.muted2{color:var(--gray-600)}

/* ---------- cards ---------- */
.glass{background:rgba(255,255,255,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.glass95{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.feature-card{background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:.5rem;padding:1.5rem;
  box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.3);text-align:center}
.feature-card h3{font-size:1.125rem;font-weight:600;color:var(--gray-900);margin-bottom:.5rem}
.feature-card p{color:var(--gray-600);font-size:.875rem;line-height:1.6}
.icon-bubble{width:fit-content;margin:0 auto 1rem;padding:.75rem;border-radius:9999px}
.bub-blue{background:rgba(219,234,254,.8);color:var(--blue-700)}
.bub-purple{background:rgba(243,232,255,.8);color:var(--purple-700)}
.bub-green{background:rgba(220,252,231,.8);color:var(--green-700)}
.panel{background:#fff;border:1px solid var(--gray-200);border-radius:.5rem;padding:1.5rem}
.panel-glass{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:.5rem;padding:1.5rem;
  box-shadow:var(--shadow-xl);border:1px solid var(--gray-200)}
.note{border-radius:.5rem;padding:1rem 1.25rem;font-size:.875rem;border:1px solid}
.note-blue{background:rgba(239,246,255,.95);border-color:var(--blue-200);color:var(--blue-800)}
.note-green{background:rgba(240,253,244,.95);border-color:var(--green-200);color:var(--green-800)}
.note-amber{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-800)}
.note-gray{background:rgba(249,250,251,.95);border-color:var(--gray-200);color:var(--gray-700)}
.note-red{background:var(--red-50);border-color:var(--red-200);color:var(--red-700)}
.note h3{font-size:1.125rem;font-weight:600;margin-bottom:.75rem}
.note-blue h3{color:var(--blue-900)}.note-green h3{color:var(--green-900)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.5rem;
  font-weight:500;transition:all .18s ease;padding:.75rem 1.5rem;font-size:1rem;text-decoration:none}
.btn:disabled{background:var(--gray-300)!important;color:#fff!important;box-shadow:none!important;transform:none!important}
.btn-amber{background:var(--amber-600);color:#fff}
.btn-amber:hover:not(:disabled){background:var(--amber-700)}
.btn-green{background:var(--green-600);color:#fff}
.btn-green:hover:not(:disabled){background:var(--green-700)}
.btn-blue{background:var(--blue-600);color:#fff}
.btn-blue:hover:not(:disabled){background:var(--blue-700)}
.btn-gray{background:var(--gray-600);color:#fff}
.btn-gray:hover:not(:disabled){background:var(--gray-700)}
.btn-soft-red{background:var(--red-100);color:var(--red-700)}
.btn-soft-red:hover{background:var(--red-200)}
.btn-grad-pb{background:linear-gradient(90deg,var(--purple-600),var(--blue-600));color:#fff;box-shadow:var(--shadow-md)}
.btn-grad-pb:hover:not(:disabled){background:linear-gradient(90deg,var(--purple-700),var(--blue-700));box-shadow:var(--shadow-lg)}
.btn-grad-gb{background:linear-gradient(90deg,var(--green-600),var(--blue-600));color:#fff;box-shadow:var(--shadow-lg)}
.btn-grad-gb:hover{background:linear-gradient(90deg,var(--green-700),var(--blue-700))}
.btn-hero{background:rgba(217,119,6,.9);backdrop-filter:blur(6px);color:#fff;padding:1rem 2rem;
  font-size:1.125rem;font-weight:600;box-shadow:var(--shadow-lg);border:1px solid rgba(245,158,11,.5)}
.btn-hero:hover{background:rgba(180,83,9,.95);box-shadow:var(--shadow-xl);transform:scale(1.05)}
.btn-full{width:100%}
.btn-sm{padding:.5rem 1rem;font-size:.875rem}
.link-amber{color:var(--amber-600);font-weight:500;background:none}
.link-amber:hover{color:var(--amber-700)}
.link-back{color:var(--amber-300);font-weight:500;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.link-back:hover{color:var(--amber-200)}
.icon-btn{padding:.75rem;border-radius:.5rem;transition:background .18s;box-shadow:var(--shadow-sm);display:inline-flex}
.ib-gray{background:var(--gray-100);color:var(--gray-600)}.ib-gray:hover{background:var(--gray-200)}
.ib-amber{background:var(--amber-100);color:var(--amber-600)}.ib-amber:hover{background:var(--amber-200)}
.ib-green{background:var(--green-100);color:var(--green-600)}.ib-green:hover{background:var(--green-200)}
.ib-red{background:var(--red-100);color:var(--red-600)}.ib-red:hover{background:var(--red-200)}
.ib-blue{background:var(--blue-100);color:var(--blue-600)}
.icon-btn:disabled{opacity:.45}

/* ---------- forms ---------- */
.label{display:block;font-size:.875rem;font-weight:500;color:var(--gray-700);margin-bottom:.5rem}
.label-lg{display:block;font-size:1.125rem;font-weight:600;color:var(--gray-900);margin-bottom:.75rem}
.input,.textarea,.select{width:100%;padding:.75rem 1rem;border:1px solid var(--gray-300);border-radius:.5rem;
  background:#fff;font-size:1rem;transition:box-shadow .15s,border-color .15s}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:transparent;box-shadow:0 0 0 2px var(--amber-500)}
.input:disabled,.textarea:disabled,.select:disabled{background:var(--gray-100);cursor:not-allowed}
.input-sm{padding:.5rem .75rem}
.textarea{resize:vertical;line-height:1.6}
.textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875rem}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right .7rem center;background-size:1.1rem;padding-right:2.4rem}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.field-row{display:flex;flex-direction:column;gap:.75rem}
@media(min-width:640px){.field-row{flex-direction:row}}

/* ---------- progress ---------- */
.progress{width:100%;background:var(--gray-200);border-radius:9999px;height:.5rem;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:9999px;background:var(--amber-600);transition:width .3s}
.progress.grad > i{background:linear-gradient(90deg,var(--purple-600),var(--blue-600))}
.spin{display:inline-block;width:1.25rem;height:1.25rem;border-radius:9999px;
  border:2px solid transparent;border-bottom-color:currentColor;animation:sp .8s linear infinite}
.spin.sm{width:1rem;height:1rem}
.spin.lg{width:4rem;height:4rem;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- disclaimer banner ---------- */
.disclaimer{background:var(--amber-50);border-bottom:1px solid var(--amber-200);padding:.75rem 1rem;position:relative;z-index:40}
.disclaimer .in{max-width:80rem;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.disclaimer .txt{font-size:.875rem;color:var(--amber-800)}
.disclaimer .txt p:first-child{font-weight:500;margin-bottom:.25rem}
.disclaimer .x{padding:.25rem;color:var(--amber-600);flex-shrink:0}
.disclaimer .x:hover{color:var(--amber-900)}

/* ---------- top status bar (replaces the old auth header) ---------- */
.topbar{position:absolute;top:1rem;right:1rem;display:flex;align-items:center;gap:.5rem;z-index:50;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.25);border-radius:9999px;padding:.5rem 1rem;color:#fff;font-size:.8125rem;font-weight:500}
.pill.act{cursor:pointer;transition:background .18s}
.pill.act:hover{background:rgba(255,255,255,.22)}
.pill .dot{width:.5rem;height:.5rem;border-radius:9999px;background:var(--green-500);flex-shrink:0}
.pill .dot.off{background:var(--red-500)}
.pill .dot.warn{background:var(--amber-400)}
.pill.dark{background:rgba(17,24,39,.72);border-color:rgba(17,24,39,.2)}
.topbar.on-light .pill{background:rgba(17,24,39,.06);border-color:var(--gray-300);color:var(--gray-700)}
.topbar.on-light .pill.act:hover{background:rgba(17,24,39,.12)}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:.5rem;border-radius:.5rem}
.tab{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:.5rem;font-weight:500;
  color:#fff;transition:all .18s}
.tab:hover{background:rgba(255,255,255,.2)}
.tab.on{background:#fff;color:var(--gray-900);box-shadow:var(--shadow-lg)}

/* ---------- dropzone ---------- */
.drop-zone{position:relative;border:2px dashed var(--gray-300);border-radius:.5rem;padding:2rem;text-align:center;
  transition:all .2s;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);box-shadow:var(--shadow-xl)}
.drop-zone.plain{background:var(--gray-50);box-shadow:none;padding:1.5rem}
.drop-zone:hover{border-color:var(--amber-400)}
.drop-zone.active{border-color:var(--amber-500);background:rgba(255,251,235,.95)}
.drop-zone.done{border-color:var(--green-500);background:rgba(240,253,244,.95)}
.file-link{color:var(--amber-600);text-decoration:underline;cursor:pointer}
.file-link:hover{color:var(--amber-700)}

/* ---------- collected sources ---------- */
.src-item{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:1rem;
  background:linear-gradient(90deg,var(--green-50),var(--blue-50));border:1px solid var(--green-200);border-radius:.5rem}
.src-item .ttl{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--gray-900);margin-bottom:.5rem}
.src-x{color:var(--red-600);flex-shrink:0}
.src-x:hover{color:var(--red-700)}
.collected{margin-bottom:1.5rem;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:.5rem;
  padding:1.5rem;box-shadow:var(--shadow-xl);border:2px solid var(--green-500)}

/* ---------- option tiles (fictional creator) ---------- */
.tiles{display:grid;gap:.75rem;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tiles.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.tiles.four{grid-template-columns:repeat(4,1fr)}}
.tile{padding:1rem;border-radius:.5rem;border:2px solid var(--gray-200);background:#fff;transition:all .18s;text-align:center}
.tile:hover:not(:disabled){background:var(--gray-50)}
.tile .em{font-size:1.875rem;line-height:1;margin-bottom:.5rem}
.tile .nm{font-weight:500;font-size:.875rem;color:var(--gray-900)}
.tile .ds{font-size:.75rem;color:var(--gray-500);margin-top:.25rem}
.tile.on-purple{border-color:var(--purple-500);background:var(--purple-50);box-shadow:var(--shadow-md)}
.tile:hover.tile-purple:not(.on-purple){border-color:var(--purple-300)}
.tile.on-blue{border-color:var(--blue-500);background:var(--blue-50);box-shadow:var(--shadow-md)}
.tile.on-green{border-color:var(--green-500);background:var(--green-50);box-shadow:var(--shadow-md)}
.tile.on-amber{border-color:var(--amber-500);background:var(--amber-50);box-shadow:var(--shadow-md)}
.tile.on-pink{border-color:var(--pink-500);background:var(--pink-50);box-shadow:var(--shadow-md)}
.tile .chk{color:var(--purple-600);margin:.5rem auto 0}

/* ---------- choice cards ---------- */
.choice-grid{display:grid;gap:1.5rem}
@media(min-width:768px){.choice-grid{grid-template-columns:repeat(2,1fr)}}
.choice{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:.75rem;padding:2rem;
  box-shadow:var(--shadow-xl);transition:all .2s;text-align:left;display:block;width:100%}
.choice:hover{box-shadow:var(--shadow-2xl);transform:scale(1.03)}
.choice h3{font-size:1.5rem;font-weight:700;color:var(--gray-900)}
.choice > p{color:var(--gray-600);margin-bottom:1rem}
.choice li{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--gray-600);margin-bottom:.5rem;list-style:none}
.choice li .tick{color:var(--green-500);font-weight:700}
.choice .ico{padding:1rem;border-radius:9999px;margin-right:1rem;display:inline-flex}
.ico-amber{background:var(--amber-100);color:var(--amber-600)}
.ico-purple{background:var(--purple-100);color:var(--purple-600)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;background-attachment:fixed;
  background-size:cover;background-position:center}
.chat > .veil{position:absolute;inset:0;background:rgba(0,0,0,.2);pointer-events:none}
.chat-head{position:relative;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--gray-200);padding:.75rem 1.5rem;box-shadow:var(--shadow-lg)}
.avatar{width:4rem;height:4rem;border-radius:9999px;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow-lg);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ini{width:100%;height:100%;background:linear-gradient(135deg,var(--amber-400),var(--amber-600));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.25rem}
.avatar-wrap{position:relative;margin-right:1rem}
.avatar-regen{position:absolute;bottom:-.25rem;right:-.25rem;padding:.375rem;background:var(--amber-500);color:#fff;
  border-radius:9999px;box-shadow:var(--shadow-md);display:inline-flex;transition:background .18s}
.avatar-regen:hover:not(:disabled){background:var(--amber-600)}
.avatar-regen:disabled{background:var(--gray-300)}
.chat-name{font-size:1.5rem;font-weight:700;color:var(--gray-900);line-height:1.2}
.chat-meta{font-size:.9375rem;color:var(--gray-600);font-weight:500}
.chat-body{position:relative;z-index:10;flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.5rem}
.starters{display:grid;gap:.75rem;grid-template-columns:1fr}
@media(min-width:640px){.starters{grid-template-columns:repeat(2,1fr)}}
.starter{text-align:left;padding:1rem;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  border:1px solid var(--amber-200);border-radius:.5rem;font-weight:500;box-shadow:var(--shadow-lg);transition:all .2s}
.starter:hover{background:rgba(255,251,235,.95);box-shadow:var(--shadow-xl);transform:scale(1.03)}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bubble{max-width:24rem;padding:1rem 1.25rem;border-radius:1rem;box-shadow:var(--shadow-lg)}
@media(min-width:1024px){.bubble{max-width:32rem}}
.bubble.me{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));color:#fff}
.bubble.them{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:1px solid var(--gray-200);color:var(--gray-900)}
.bubble .body{font-size:1rem;line-height:1.65;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .ts{font-size:.75rem;margin-top:.5rem;color:var(--gray-500)}
.bubble.me .ts{color:var(--amber-100)}
.bubble img{border-radius:.75rem;width:100%;height:auto;box-shadow:var(--shadow-lg);margin-bottom:.5rem}
.dots{display:flex;gap:.25rem}
.dots i{width:.75rem;height:.75rem;background:var(--gray-400);border-radius:9999px;animation:bnc 1s infinite}
.dots i:nth-child(2){animation-delay:.1s}.dots i:nth-child(3){animation-delay:.2s}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35rem)}}
.chat-input{position:relative;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--gray-200);padding:1rem 1.5rem;box-shadow:var(--shadow-lg)}
.chat-input .field{position:relative;flex:1}
.chat-input input{width:100%;padding:1rem 6rem 1rem 1.25rem;font-size:1.0625rem;border:2px solid var(--gray-300);
  border-radius:.75rem;font-weight:500;box-shadow:var(--shadow-sm)}
.chat-input input:focus{outline:none;border-color:var(--amber-500);box-shadow:0 0 0 2px var(--amber-500)}

<script>
/* =============================================================
   Historical Figures AI Chat — single file, no build step.
   Login removed · JSON save/load replaces Supabase.

   Provider ladder, resolved automatically at startup:
     1. Ollama   local server on http://localhost:11434, no key
     2. WebLLM   in-browser model, no key, needs WebGPU
     3. OpenAI   cloud fallback, key pulled from the shared vault
                 DV_AI_KEYS / DV_OPENAI_API_KEY, or asked for once
   Claude and Gemini remain available as manual choices.
   The user can override the ladder at any time in AI setup.
   ============================================================= */
(function(){
"use strict";

/* ===============================================================
   0. EMBED COMPATIBILITY LAYER
   ---------------------------------------------------------------
   This app is often opened as a window inside another app: an
   <iframe> in a launcher, a desktop shell, a portal page, a
   Cowork/Electron wrapper. Four things break in that situation,
   and all four are handled here so every provider — Ollama
   included — keeps working:

     1. STORAGE. A sandboxed or partitioned frame makes
        localStorage throw on the very first touch, which used to
        kill the script before boot. pickStorage() falls back to
        the host's storage (when the parent is same origin) and
        then to memory, so the app always starts.

     2. TRANSPORT. A frame with an opaque origin sends
        "Origin: null", which Ollama rejects unless OLLAMA_ORIGINS
        allows it; a parent CSP can block connect-src outright.
        dvFetch() tries the direct call first and, if the network
        layer refuses, asks the host page to make the call and
        relay the answer back over postMessage.

     3. RUNTIME. WebGPU, the camera and the microphone are all
        gated on a secure context and on iframe permissions.
        We detect this and say exactly which attribute is missing
        instead of failing with a vague error.

     4. CONFIG. A host can hand down the Ollama URL, the provider
        and the shared key vault, either through the URL hash or
        through a postMessage, so a frame with no usable storage
        still starts up already configured.

   HOST SIDE. None of this is required — the app degrades
   gracefully — but a host that wants Ollama to work from inside a
   sandboxed frame should embed the app like this:

     <iframe src="index.html"
             sandbox="allow-scripts allow-same-origin allow-downloads
                      allow-popups allow-forms allow-modals"
             allow="camera; microphone; clipboard-write; local-network-access">
     </iframe>

   local-network-access is what lets the frame reach Ollama on the user's
   own machine under Chromium 142+. Every frame in the chain needs it.

   and paste the bridge listener printed by AI setup -> "Running
   inside another app" -> "Copy host bridge" into the host page.
   =============================================================== */

const EMBED = (()=>{
  let framed=false, sameOriginTop=false, org='null';
  try{ framed = window.self !== window.top; }catch(e){ framed = true; }
  try{ sameOriginTop = framed ? (typeof window.top.location.href === 'string') : true; }
  catch(e){ sameOriginTop = false; }
  try{ org = window.origin || location.origin || 'null'; }catch(e){ org='null'; }
  return {
    framed,
    sameOriginTop,
    origin: org,
    opaque: (org==='null'),
    secure: !!window.isSecureContext,
    proto: location.protocol,
    storageVia: 'own',      // own | host | memory
    bridge: false,          // true once a host answers the handshake
    relayed: false          // true once a request has actually gone via the host
  };
})();

/** Read a setting the host may have pinned to the URL: ?ollama=... or #ollama=... */
function embedParam(name){
  try{
    const q=new URLSearchParams(location.search);
    if(q.has(name)) return String(q.get(name)||'').trim();
  }catch(e){}
  try{
    const h=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
    if(h.has(name)) return String(h.get(name)||'').trim();
  }catch(e){}
  return '';
}

/* ---------------- storage that cannot throw ---------------- */
function memoryStorage(){
  const m=new Map();
  return {
    get length(){ return m.size; },
    key(i){ const k=Array.from(m.keys()); return i<k.length?k[i]:null; },
    getItem(k){ k=String(k); return m.has(k)?m.get(k):null; },
    setItem(k,v){ m.set(String(k), String(v)); },
    removeItem(k){ m.delete(String(k)); },
    clear(){ m.clear(); }
  };
}
function usable(store){
  const probe='__dv_probe__';
  store.setItem(probe,'1');
  const ok = store.getItem(probe)==='1';
  store.removeItem(probe);
  if(!ok) throw new Error('storage is read only');
  return store;
}
function pickStorage(kind){
  try{ return usable(window[kind]); }catch(e){}
  try{ if(EMBED.sameOriginTop){ const s=usable(window.top[kind]); EMBED.storageVia='host'; return s; } }catch(e){}
  EMBED.storageVia='memory';
  return memoryStorage();
}
/* These shadow the globals for the whole app. Every existing call
   site keeps its familiar spelling and simply stops throwing. */
const localStorage   = pickStorage('localStorage');
const sessionStorage = pickStorage('sessionStorage');

/* ---------------- host bridge (postMessage RPC) ---------------- */
const nativeFetch = (typeof window.fetch==='function') ? window.fetch.bind(window) : null;

const HOST = (()=>{
  const pending=new Map();
  let seq=0, ready=false, sentHello=false, waiters=[];
  const inbox=[];                       // config messages that arrive before boot

  function post(msg){
    try{ (window.parent||window.top).postMessage(msg,'*'); return true; }catch(e){ return false; }
  }

  window.addEventListener('message', ev=>{
    const d=ev.data;
    if(!d || typeof d!=='object' || typeof d.dv!=='string') return;

    if(d.dv==='ready'){
      ready=true; EMBED.bridge=true;
      waiters.splice(0).forEach(fn=>fn(true));
      return;
    }
    if(d.dv==='config'){ inbox.push(d); applyHostConfig(d); return; }
    if(d.dv==='fetch-result'){
      const p=pending.get(d.id);
      if(!p) return;
      pending.delete(d.id); clearTimeout(p.timer);
      if(d.error) p.reject(new Error(String(d.error)));
      else p.resolve(buildResponse(d));
    }
  });

  function buildResponse(d){
    let body=null;
    if(typeof d.bodyBase64==='string'){
      const bin=atob(d.bodyBase64), arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      body=arr;
    }else if(typeof d.bodyText==='string'){
      body=d.bodyText;
    }
    const status=d.status||200;
    const init={ status, statusText:d.statusText||'', headers:d.headers||{} };
    try{ return new Response((status===204||status===205||status===304)?null:body, init); }
    catch(e){
      // Very old engine: hand back something the app can still read.
      const text = (typeof d.bodyText==='string') ? d.bodyText : '';
      return {
        ok: status>=200 && status<300, status, statusText:init.statusText,
        headers:{ get:k=>(d.headers||{})[String(k).toLowerCase()]||null },
        text:async()=>text, json:async()=>JSON.parse(text||'null'),
        blob:async()=>new Blob([body||text]), arrayBuffer:async()=>new Blob([body||text]).arrayBuffer()
      };
    }
  }

  function hello(){
    if(sentHello || !EMBED.framed) return;
    sentHello=true;
    post({ dv:'hello', app:'historical-figures-ai-chat', v:1 });
  }

  let absent=false;              // a handshake has already gone unanswered
  function waitReady(ms){
    if(ready) return Promise.resolve(true);
    if(!EMBED.framed) return Promise.resolve(false);
    // Do not pay the handshake wait again on every later call.
    if(absent && !ms) return Promise.resolve(false);
    if(ms){ absent=false; sentHello=false; }   // an explicit retry asks again
    hello();
    return new Promise(res=>{
      waiters.push(res);
      setTimeout(()=>{
        const i=waiters.indexOf(res);
        if(i>=0) waiters.splice(i,1);
        if(!ready) absent=true;
        res(ready);
      }, ms||700);
    });
  }

  async function relay(url, init, ms){
    if(!(await waitReady())) throw new Error('No host bridge is listening.');
    init = init||{};
    const headers = {};
    try{
      if(init.headers){
        if(typeof init.headers.forEach==='function') init.headers.forEach((v,k)=>{ headers[k]=v; });
        else Object.keys(init.headers).forEach(k=>{ headers[k]=init.headers[k]; });
      }
    }catch(e){}
    const body = (typeof init.body==='string') ? init.body : (init.body==null?null:String(init.body));
    const id='dv'+(++seq)+'.'+Date.now();

    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{
        pending.delete(id);
        reject(new Error('The host did not answer in time.'));
      }, ms||60000);
      pending.set(id,{resolve,reject,timer});

      if(init.signal){
        if(init.signal.aborted){
          clearTimeout(timer); pending.delete(id);
          return reject(new DOMException('Aborted','AbortError'));
        }
        init.signal.addEventListener('abort',()=>{
          const p=pending.get(id);
          if(!p) return;
          pending.delete(id); clearTimeout(p.timer);
          p.reject(new DOMException('Aborted','AbortError'));
        },{once:true});
      }

      const sent = post({ dv:'fetch', id, url,
        method:(init.method||'GET').toUpperCase(), headers, body });
      if(!sent){
        clearTimeout(timer); pending.delete(id);
        reject(new Error('Cannot talk to the host page.'));
      }
    });
  }

  return { hello, waitReady, relay, get ready(){ return ready; }, get inbox(){ return inbox; } };
})();

/** Settings the host pushed down: Ollama URL, provider, shared keys. */
let _appReady=false;              // flipped in boot(), once S and PROVIDERS exist
let _pendingHostConfig=null;
function applyHostConfig(cfg){
  if(!cfg || typeof cfg!=='object') return;
  if(!_appReady){ _pendingHostConfig=cfg; return; }   // arrived before state exists
  try{
    if(cfg.ollamaUrl) S.ai.ollamaUrl=String(cfg.ollamaUrl).replace(/\/+$/,'');
    if(cfg.provider && PROVIDERS[cfg.provider]){ S.ai.provider=cfg.provider; S.ai.pinned=true; }
    if(cfg.keys && typeof cfg.keys==='object'){
      for(const p of ['openai','anthropic','gemini'])
        if(typeof cfg.keys[p]==='string' && cfg.keys[p]) S.ai.keys[p]=cfg.keys[p].trim();
      KeyVault.write(S.ai.keys);
    }
    if(typeof updateAIStatus==='function') updateAIStatus();
  }catch(e){}
}

/* ---------------- transport ---------------- */
const RELAY_ORIGINS = new Set();     // origins already proven unreachable directly

function originOf(u){
  try{ return new URL(u, location.href).origin; }catch(e){ return String(u); }
}
function isNetworkFailure(err){
  // A CORS rejection, a blocked mixed-content request, a sandbox veto and a
  // dead server all surface as the same opaque TypeError.
  return !!err && (err.name==='TypeError' || /network|failed to fetch|load failed/i.test(err.message||''));
}

/**
 * fetch() for embedded life. Direct first; the host relays only when the
 * direct call is refused at the network layer, so nothing changes when the
 * app is opened normally.
 */
async function dvFetch(input, init){
  const url = (typeof input==='string') ? input
            : (input && typeof input.url==='string') ? input.url : String(input);
  const org = originOf(url);

  if(EMBED.framed && RELAY_ORIGINS.has(org) && HOST.ready){
    try{ return await HOST.relay(url, init); }catch(e){ /* fall through and retry directly */ }
  }
  if(!nativeFetch) return HOST.relay(url, init);

  try{
    return await nativeFetch(input, init);
  }catch(err){
    if(EMBED.framed && isNetworkFailure(err) && !(init && init.signal && init.signal.aborted)){
      try{
        const r = await HOST.relay(url, init);
        RELAY_ORIGINS.add(org);
        EMBED.relayed = true;
        return r;
      }catch(e2){ /* no bridge, or the host could not reach it either */ }
    }
    throw err;
  }
}
const fetch = dvFetch;

/* ---------------- what is blocked, and how to unblock it ---------------- */
function embedReport(){
  const out={ framed:EMBED.framed, problems:[], notes:[] };
  if(!EMBED.framed) return out;

  if(EMBED.opaque)
    out.problems.push({
      what:'This frame has no origin of its own, so it is not a secure context.',
      why:'WebGPU, the camera and the microphone are switched off, and Ollama sees the request as coming from "null".',
      fix:'Add allow-same-origin to the iframe sandbox attribute.'
    });
  else if(!EMBED.secure && EMBED.proto!=='file:')
    out.problems.push({
      what:'This frame is not a secure context.',
      why:'WebLLM cannot use WebGPU here.',
      fix:'Serve the host page over https, or open it from file://.'
    });

  if(EMBED.storageVia==='memory')
    out.problems.push({
      what:'Storage is blocked in this frame.',
      why:'Keys and saved sessions last only until the window closes.',
      fix:'Add allow-same-origin to the sandbox attribute, or have the host push the keys down with a config message.'
    });
  else if(EMBED.storageVia==='host')
    out.notes.push('Settings are being written to the host page\u2019s storage, so the shared key vault still works.');

  if(!navigator.gpu)
    out.notes.push('No WebGPU in this frame, so WebLLM is unavailable. Ollama and the cloud providers are unaffected.');

  if(!navigator.mediaDevices)
    out.notes.push('No camera or microphone here. Add allow="camera; microphone" to the iframe.');

  if(EMBED.bridge) out.notes.push('A host bridge is listening'+(EMBED.relayed?' and is relaying requests.':'.'));
  else out.notes.push('No host bridge is listening. If Ollama cannot be reached directly, paste the bridge into the host page.');

  return out;
}

/* ===============================================================
   SHARED API KEY VAULT  —  cross-application contract
   ---------------------------------------------------------------
   Other Digital Vector single-file apps should read and write the
   SAME two localStorage entries so a key is typed once per browser.

     DV_AI_KEYS          JSON, the canonical store:
                         {"v":1,"openai":"sk-...","anthropic":"sk-ant-...",
                          "gemini":"AIza...","updated":"<ISO date>"}

     DV_OPENAI_API_KEY   plain string mirror of the OpenAI key, for
                         apps that only ever need OpenAI.

   Minimal reader for another app:
     const k = (()=>{ try{ return JSON.parse(localStorage.getItem('DV_AI_KEYS')||'{}').openai
                        || localStorage.getItem('DV_OPENAI_API_KEY') || ''; }catch(e){ return ''; } })();

   Both entries are kept in step by KeyVault.set(). localStorage is
   scoped to the origin, so every app served from the same origin
   (or opened from file:// in Chrome / Edge) shares one vault.
   =============================================================== */
const DV_VAULT      = 'DV_AI_KEYS';
const DV_OPENAI_KEY = 'DV_OPENAI_API_KEY';
/* Older or third-party spellings we will read, but never write. */
const DV_LEGACY = {
  openai:   ['OPENAI_API_KEY','openai_api_key','openai-api-key','dv.openai.key','hfchat.openai.key'],
  anthropic:['ANTHROPIC_API_KEY','anthropic_api_key','dv.anthropic.key'],
  gemini:   ['GEMINI_API_KEY','GOOGLE_API_KEY','gemini_api_key','dv.gemini.key']
};

const KeyVault = {
  read(){
    let out={ openai:'', anthropic:'', gemini:'' };
    try{
      const raw=localStorage.getItem(DV_VAULT);
      if(raw){
        const j=JSON.parse(raw);
        if(j && typeof j==='object'){
          for(const p of Object.keys(out)) if(typeof j[p]==='string') out[p]=j[p].trim();
        }
      }
    }catch(e){}
    try{
      const solo=localStorage.getItem(DV_OPENAI_KEY);
      if(!out.openai && solo) out.openai=String(solo).trim();
    }catch(e){}
    for(const p of Object.keys(out)){
      if(out[p]) continue;
      for(const alt of (DV_LEGACY[p]||[])){
        try{ const v=localStorage.getItem(alt); if(v){ out[p]=String(v).trim(); break; } }catch(e){}
      }
    }
    return out;
  },
  get(provider){ return this.read()[provider]||''; },
  write(keys){
    const cur=this.read();
    const next={ ...cur, ...keys };
    try{
      localStorage.setItem(DV_VAULT, JSON.stringify({
        v:1,
        openai:next.openai||'', anthropic:next.anthropic||'', gemini:next.gemini||'',
        updated:new Date().toISOString()
      }));
      if(next.openai) localStorage.setItem(DV_OPENAI_KEY, next.openai);
      else localStorage.removeItem(DV_OPENAI_KEY);
      return true;
    }catch(e){ return false; }
  },
  set(provider, value){ const o={}; o[provider]=(value||'').trim(); return this.write(o); },
  clear(){
    try{
      localStorage.removeItem(DV_VAULT);
      localStorage.removeItem(DV_OPENAI_KEY);
      for(const p of Object.keys(DV_LEGACY))
        for(const alt of DV_LEGACY[p]) localStorage.removeItem(alt);
    }catch(e){}
  },
  /** Pull anything the vault knows into live state. Vault wins over a stale session. */
  hydrate(target){
    const v=this.read(); let found=false;
    for(const p of ['openai','anthropic','gemini']) if(v[p]){ target[p]=v[p]; found=true; }
    return found;
  }
};

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n||0).toLocaleString();
const uid = p => (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function fmtSize(bytes){
  if(!bytes) return '0 Bytes';
  const k=1024, sizes=['Bytes','KB','MB','GB'], i=Math.floor(Math.log(bytes)/Math.log(k));
  return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+' '+sizes[i];
}
function timeStr(d){ return new Date(d).toLocaleTimeString(); }
/** Read/write a dotted path on the state object. */
function getPath(o,p){ return p.split('.').reduce((a,k)=> a==null?a:a[k], o); }
function setPath(o,p,v){
  const ks=p.split('.'); const last=ks.pop();
  let t=o; for(const k of ks){ if(t[k]==null) t[k]={}; t=t[k]; }
  t[last]=v;
}
function toast(msg,kind,ms){
  const wrap=$('#toasts'); if(!wrap) return;
  const el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:'');
  el.innerHTML=(kind==='ok'?I('check',16):kind==='err'?I('alert',16):kind==='warn'?I('warn',16):'')+'<span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, ms||3200);
}
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function pickFile(accept){
  return new Promise(res=>{
    const inp=document.createElement('input'); inp.type='file'; if(accept) inp.accept=accept;
    inp.onchange=()=>res(inp.files&&inp.files[0]?inp.files[0]:null);
    inp.click();
  });
}
/** Fake-but-honest progress ticker used across the original UI. */
function ticker(setter, step, cap, interval){
  let v=0;
  const id=setInterval(()=>{ v=Math.min(cap||90, v+(step||10)); setter(v); }, interval||300);
  return { stop(){ clearInterval(id); }, done(){ clearInterval(id); setter(100); } };
}

function snapshot(includeKeys){
  return {
    app:'historical-figures-ai-chat',
    format:'hfchat-project',
    version:1,
    savedAt:new Date().toISOString(),
    settings:{
      provider:S.ai.provider,
      pinned:S.ai.pinned,
      ollamaUrl:S.ai.ollamaUrl,
      model:{...S.ai.model},
      keys: includeKeys ? {...S.ai.keys} : { openai:'', anthropic:'', gemini:'' },
      voice:{...S.voice}
    },
    character:S.character,
    messages:S.messages,
    source:S.source,
    collected:S.upload.collected,
    creator:{ form:{...S.creator.form}, profile:S.creator.profile,
              avatar:S.creator.avatar, background:S.creator.background },
    library:S.library,
    step:S.step
  };
}
function saveLocal(){
  try{
    const snap=snapshot(true);
    localStorage.setItem(LS_KEY, JSON.stringify(snap));
  }catch(e){ /* quota — silently skip, the JSON file is the real store */ }
}
const saveLocalSoon = (()=>{ let t; return ()=>{ clearTimeout(t); t=setTimeout(saveLocal, 600); }; })();

function applySnapshot(data, opts){
  if(!data || typeof data!=='object') throw new Error('That file is not a saved session.');
  if(data.format && data.format!=='hfchat-project' && data.format!=='hfchat-character')
    throw new Error('Unrecognised file format.');
  if(data.format==='hfchat-character' || (data.character && !data.settings && !data.messages)){
    // A single exported character card
    const ch = data.character || data;
    S.character = ch;
    S.messages = [];
    S.step='chat';
    addToLibrary(ch);
    return 'character';
  }
  const st=data.settings||{};
  if(st.provider) S.ai.provider=st.provider;
  if(st.pinned!=null) S.ai.pinned=!!st.pinned;
  if(st.ollamaUrl) S.ai.ollamaUrl=st.ollamaUrl;
  if(st.model) S.ai.model={...S.ai.model, ...st.model};
  if(st.keys && (!opts || opts.keys!==false)){
    S.ai.keys={...S.ai.keys, ...st.keys};
    // A key that arrives inside a session file joins the shared vault too.
    KeyVault.write(S.ai.keys);
  }
  KeyVault.hydrate(S.ai.keys);
  if(st.voice) S.voice={...S.voice, ...st.voice};
  S.character = data.character||null;
  S.messages  = (data.messages||[]).map(m=>({...m, timestamp:m.timestamp||new Date().toISOString()}));
  S.source    = data.source||null;
  S.upload.collected = data.collected||[];
  if(data.creator){
    S.creator.form    = scrubForm({...S.creator.form, ...(data.creator.form||{})});
    S.creator.profile = data.creator.profile||null;
    S.creator.avatar  = data.creator.avatar||null;
    S.creator.background = data.creator.background||null;
  }
  S.library = data.library||S.library;
  S.step = data.step || (S.character?'chat':(S.source?'character':'welcome'));
  return 'project';
}
function restoreLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    applySnapshot(JSON.parse(raw));
    return true;
  }catch(e){ return false; }
}
function loadLibrary(){
  try{ S.library = JSON.parse(localStorage.getItem(LS_LIB)||'[]'); }catch(e){ S.library=[]; }
}
function persistLibrary(){
  try{ localStorage.setItem(LS_LIB, JSON.stringify(S.library.slice(0,40))); }catch(e){}
}
function addToLibrary(ch){
  if(!ch) return;
  S.library = [ {...ch, _saved:new Date().toISOString()} ]
    .concat(S.library.filter(c=>c.id!==ch.id));
  persistLibrary();
}

/* --- OpenAI model ranking, ported from the original edge functions --- */
const CHAT_EXCLUDE = ['tts','image','embedding','realtime','audio','whisper','moderation',
  'instruct','search','transcribe','davinci','babbage','ada','curie'];
const isSnapshot = id => /\d{4}-\d{2}-\d{2}/.test(id);
const isFastTier = id => /mini|nano|micro/.test(id);
function isOpenAIChatModel(id){
  if(!/^(gpt-|o\d)/.test(id)) return false;
  return !CHAT_EXCLUDE.some(t=>id.includes(t));
}
function selectOpenAIChat(models, tier){
  const chat = models.filter(m=>isOpenAIChatModel(m.id));
  if(!chat.length) return tier==='fast' ? 'gpt-4o-mini' : 'gpt-4o';
  if(tier==='fast'){
    const alias = chat.filter(m=>isFastTier(m.id) && !isSnapshot(m.id));
    if(alias.length) return alias[0].id;
    const any = chat.filter(m=>isFastTier(m.id));
    if(any.length) return any[0].id;
    return chat[chat.length-1].id;
  }
  const alias = chat.filter(m=>!isFastTier(m.id) && !isSnapshot(m.id));
  if(alias.length) return alias[0].id;
  const any = chat.filter(m=>!isFastTier(m.id));
  return any.length ? any[0].id : chat[0].id;
}
const isImageModel = id => id.startsWith('gpt-image-') || id.startsWith('dall-e-');
function selectImageModel(models){
  const alias = models.filter(m=>isImageModel(m.id) && !isSnapshot(m.id));
  if(alias.length) return alias[0].id;
  const any = models.filter(m=>isImageModel(m.id));
  return any.length ? any[0].id : 'gpt-image-1';
}
const isTtsModel = id => id.startsWith('tts-') || id.endsWith('-tts');
function selectTtsModel(models){
  const alias = models.filter(m=>isTtsModel(m.id) && !isSnapshot(m.id));
  if(alias.length) return alias[0].id;
  const any = models.filter(m=>isTtsModel(m.id));
  return any.length ? any[0].id : 'tts-1';
}

let _openaiRaw = null;      // cached /v1/models payload, newest first
async function openaiRawModels(force){
  if(_openaiRaw && !force) return _openaiRaw;
  const key = S.ai.keys.openai;
  if(!key) throw new Error('Add your OpenAI key first.');
  const r = await fetch('https://api.openai.com/v1/models',{ headers:{ Authorization:'Bearer '+key }});
  if(!r.ok) throw new Error(await friendlyHttp(r,'OpenAI'));
  const raw = await r.json();
  _openaiRaw = (raw.data||[]).sort((a,b)=>(b.created||0)-(a.created||0));
  return _openaiRaw;
}
async function friendlyHttp(res, who){
  let detail='';
  try{ const j=await res.json(); detail = j.error?.message || j.message || ''; }
  catch(e){ try{ detail = await res.text(); }catch(_){} }
  if(res.status===401) return who+' rejected that key. Check it and try again.';
  if(res.status===403) return who+' refused the request. The key may lack access to this model.';
  if(res.status===429) return who+' is rate limiting. Wait a moment, then retry.';
  return who+' returned '+res.status+(detail?': '+detail.slice(0,200):'');
}

/* ---------------- Ollama addressing ----------------
   Ollama always lives on the user's own machine, but the name it
   answers to varies: localhost resolves to ::1 on some systems and
   127.0.0.1 on others, and a host page may pin a LAN address. We try
   the configured address first, then the usual suspects, and remember
   whichever one replied. */
const OLLAMA_FALLBACKS = ['http://localhost:11434','http://127.0.0.1:11434','http://[::1]:11434'];
function tidyBase(u){ return String(u||'').trim().replace(/\/+$/,''); }
function ollamaBases(){
  const out=[];
  const push=u=>{ u=tidyBase(u); if(u && out.indexOf(u)<0) out.push(u); };
  push(S.ai.ollamaUrl);
  OLLAMA_FALLBACKS.forEach(push);
  return out;
}
/** Remember the address that answered so later calls go straight there. */
function noteOllamaBase(base){
  if(tidyBase(S.ai.ollamaUrl)!==base){ S.ai.ollamaUrl=base; saveLocalSoon(); }
}
/**
 * Chromium 142+ enforces Local Network Access: a page on a public origin may not
 * reach localhost until the user allows it. Annotating the request with
 * targetAddressSpace tells the browser up front where it is going, which both
 * exempts it from the mixed-content rule and raises the permission prompt
 * instead of failing silently. Older browsers ignore the option.
 */
function localFetch(url, init){
  const opts = Object.assign({}, init||{});
  opts.targetAddressSpace = 'local';
  return fetch(url, opts);
}
/** granted | prompt | denied | unknown — the permission names changed in Chrome 145. */
async function lnaState(){
  if(!navigator.permissions || !navigator.permissions.query) return 'unknown';
  for(const name of ['local-network-access','loopback-network','local-network']){
    try{
      const st = await navigator.permissions.query({ name });
      if(st && st.state) return st.state;
    }catch(e){ /* this engine does not know that name */ }
  }
  return 'unknown';
}

/** Explain an Ollama connection failure in terms of where the app is running. */
function ollamaHelp(base){
  if(servedFromWeb())
    return 'Cannot reach Ollama at '+base+'. This page is hosted on the web, so the browser blocks it from '+
           'reaching your own machine until you say yes. Open AI setup for the two-step fix \u2014 it takes a minute, '+
           'and only has to be done once per browser.';
  if(EMBED.framed && EMBED.opaque)
    return 'Cannot reach Ollama at '+base+'. This app is running inside another app in a frame with no origin of '+
           'its own, so Ollama sees the request coming from "null". Start Ollama with OLLAMA_ORIGINS=*, or ask the '+
           'host page to add allow-same-origin to the iframe.';
  if(EMBED.framed)
    return 'Cannot reach Ollama at '+base+'. Start Ollama with OLLAMA_ORIGINS='+EMBED.origin+' (or just *), since '+
           'this app is running inside another app. See AI setup if that does not do it.';
  return 'Cannot reach Ollama at '+base+'. Check that it is running, and start it with OLLAMA_ORIGINS=* so this '+
         'page is allowed to connect.';
}
/** True when the app is being served from a public https origin, e.g. GitHub Pages. */
function servedFromWeb(){
  try{
    return location.protocol==='https:' &&
      !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  }catch(e){ return false; }
}

/* ---------------- model listing ---------------- */
const AI = {};

AI.listModels = async function(provider, force){
  const A = S.ai;
  A.loading[provider]=true; A.error[provider]='';
  try{
    let list=[];
    if(provider==='ollama'){
      const bases=ollamaBases();
      let j=null, hit='', httpErr='';
      for(const base of bases){
        try{
          const r = await localFetch(base+'/api/tags');
          if(!r.ok){ httpErr='Ollama answered '+r.status+'.'; continue; }
          j = await r.json(); hit=base; break;
        }catch(e){ /* try the next address */ }
      }
      if(!j) throw new Error(httpErr || ollamaHelp(bases[0]));
      noteOllamaBase(hit);
      list = (j.models||[]).map(m=>({ id:m.name, label:m.name,
        note: m.details?.parameter_size ? m.details.parameter_size : (m.size?fmtSize(m.size):'') }));
      A.ollamaUp = true;
      if(!list.length) A.error.ollama = 'Ollama is running but has no models. Pull one, e.g. "ollama pull llama3.2".';
    }
    else if(provider==='webllm'){
      const wl = await loadWebLLM();
      const all = (wl.prebuiltAppConfig?.model_list||[]).map(m=>({
        id:m.model_id, label:m.model_id,
        note: m.vram_required_MB ? Math.round(m.vram_required_MB/1024*10)/10+' GB VRAM' : ''
      }));
      const pick = id => all.find(m=>m.id===id);
      const top = WEBLLM_SUGGESTED.map(pick).filter(Boolean);
      const rest = all.filter(m=>!WEBLLM_SUGGESTED.includes(m.id) && /Instruct|it-|chat/i.test(m.id));
      list = top.concat(rest);
    }
    else if(provider==='openai'){
      const raw = await openaiRawModels(force);
      list = raw.filter(m=>isOpenAIChatModel(m.id)).map(m=>({ id:m.id, label:m.id,
        note: isFastTier(m.id)?'fast':(isSnapshot(m.id)?'dated snapshot':'') }));
    }
    else if(provider==='anthropic'){
      const key=A.keys.anthropic;
      if(!key) throw new Error('Add your Claude key first.');
      const r = await fetch('https://api.anthropic.com/v1/models?limit=100',{
        headers:{ 'x-api-key':key, 'anthropic-version':'2023-06-01',
                  'anthropic-dangerous-direct-browser-access':'true' }});
      if(!r.ok) throw new Error(await friendlyHttp(r,'Claude'));
      const j = await r.json();
      list = (j.data||[]).map(m=>({ id:m.id, label:m.display_name||m.id,
        note: m.created_at ? String(m.created_at).slice(0,10) : '' }));
    }
    else if(provider==='gemini'){
      const key=A.keys.gemini;
      if(!key) throw new Error('Add your Gemini key first.');
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key));
      if(!r.ok) throw new Error(await friendlyHttp(r,'Gemini'));
      const j = await r.json();
      list = (j.models||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .filter(m=>!/embedding|aqa/i.test(m.name))
        .map(m=>({ id:m.name.replace(/^models\//,''), label:m.displayName||m.name.replace(/^models\//,''), note:'' }));
    }
    A.models[provider]=list;
    if(list.length && !A.model[provider]) A.model[provider]=defaultModelFor(provider,list);
    return list;
  }catch(err){
    A.error[provider]=err.message||String(err);
    if(provider==='ollama') A.ollamaUp=false;
    A.models[provider]=[];
    throw err;
  }finally{
    A.loading[provider]=false;
  }
};
function defaultModelFor(provider,list){
  if(!list.length) return '';
  if(provider==='openai'){
    const raw=_openaiRaw||[]; return selectOpenAIChat(raw,'smart') || list[0].id;
  }
  if(provider==='anthropic'){
    const pref = list.find(m=>/sonnet/i.test(m.id)) || list.find(m=>/haiku/i.test(m.id));
    return (pref||list[0]).id;
  }
  if(provider==='gemini'){
    const pref = list.find(m=>/flash/i.test(m.id) && !/image|thinking|lite/i.test(m.id));
    return (pref||list[0]).id;
  }
  return list[0].id;
}

/** Why WebGPU is missing — the answer is usually the iframe, not the browser. */
function webgpuBlockedReason(){
  if(EMBED.framed && EMBED.opaque)
    return 'WebLLM needs WebGPU, and this frame has no origin of its own so WebGPU is switched off. '+
           'Add allow-same-origin to the iframe sandbox attribute on the host page, or use Ollama, which works here.';
  if(EMBED.framed && !EMBED.secure && EMBED.proto!=='file:')
    return 'WebLLM needs WebGPU, which only runs in a secure context. Serve the host page over https, or use Ollama.';
  return 'WebLLM needs WebGPU. Use Chrome or Edge 113+, or switch to Ollama.';
}

/* ---------------- WebLLM loader ---------------- */
let _webllmMod=null;
/* Several mirrors, because a host page's CSP often allows one CDN but not another. */
const WEBLLM_SOURCES = [
  'https://esm.run/@mlc-ai/web-llm',
  'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm',
  'https://unpkg.com/@mlc-ai/web-llm?module'
];
async function loadWebLLM(){
  if(_webllmMod) return _webllmMod;
  /* A host that already bundles WebLLM can simply hand the module over. */
  try{ if(window.DV_WEBLLM){ _webllmMod=window.DV_WEBLLM; return _webllmMod; } }catch(e){}
  try{ if(EMBED.sameOriginTop && window.top.DV_WEBLLM){ _webllmMod=window.top.DV_WEBLLM; return _webllmMod; } }catch(e){}

  let last=null;
  for(const src of WEBLLM_SOURCES){
    try{ _webllmMod = await import(src); return _webllmMod; }
    catch(e){ last=e; }
  }
  let why='WebLLM could not load. It needs one internet connection to fetch the runtime the first time.';
  if(EMBED.framed)
    why += ' Running inside another app, a Content-Security-Policy on the host page can also block the download — '+
           'allow script-src/connect-src for esm.run and jsdelivr, or set window.DV_WEBLLM on the host. '+
           'Ollama and the cloud providers do not need this.';
  const err=new Error(why);
  err.cause=last;
  throw err;
}
async function webllmEngine(){
  const A=S.ai, want=A.model.webllm;
  if(!want) throw new Error('Choose a WebLLM model in AI setup.');
  if(A.webllm.engine && A.webllm.loadedModel===want) return A.webllm.engine;
  if(!navigator.gpu) throw new Error(webgpuBlockedReason());
  const wl = await loadWebLLM();
  A.webllm.loading=true; A.webllm.progress=0; A.webllm.text='Preparing…';
  updateAIStatus();
  try{
    const engine = await wl.CreateMLCEngine(want,{
      initProgressCallback:(r)=>{
        A.webllm.progress = Math.round((r.progress||0)*100);
        A.webllm.text = r.text||'';
        updateAIStatus();
      }
    });
    A.webllm.engine=engine; A.webllm.loadedModel=want;
    return engine;
  }finally{
    A.webllm.loading=false; updateAIStatus();
  }
}

/* ---------------- chat completion ---------------- */
/**
 * messages: [{role:'system'|'user'|'assistant', content:string}]
 * opts: {temperature, maxTokens, tier}
 */
AI._chatRaw = async function(messages, opts){
  opts = opts||{};
  const A=S.ai, p=A.provider;
  const temperature = opts.temperature==null?0.8:opts.temperature;
  const maxTokens   = opts.maxTokens||800;

  if(p==='ollama'){
    const model=A.model.ollama;
    if(!model) throw new Error('Pick an Ollama model in AI setup.');
    const bases=ollamaBases();
    const payload=JSON.stringify({ model, messages, stream:false,
      options:{ temperature, num_predict:maxTokens } });
    let r=null, hit='';
    for(const base of bases){
      try{
        r = await localFetch(base+'/api/chat',{
          method:'POST', headers:{'Content-Type':'application/json'}, body:payload });
        hit=base; break;
      }catch(e){ /* try the next address */ }
    }
    if(!r) throw new Error(ollamaHelp(bases[0]));
    noteOllamaBase(hit);
    if(!r.ok) throw new Error(await friendlyHttp(r,'Ollama'));
    const j=await r.json();
    return (j.message&&j.message.content||'').trim();
  }

  if(p==='webllm'){
    const engine = await webllmEngine();
    const out = await engine.chat.completions.create({
      messages, temperature, max_tokens:maxTokens
    });
    return (out.choices?.[0]?.message?.content||'').trim();
  }

  if(p==='openai'){
    const key=A.keys.openai;
    if(!key) throw new Error('Add your OpenAI key in AI setup.');
    let model=A.model.openai;
    if(!model || opts.tier){
      try{ const raw=await openaiRawModels(); model = model || selectOpenAIChat(raw, opts.tier==='fast'?'fast':'smart'); }
      catch(e){ model = model || 'gpt-4o'; }
    }
    const send = async (body)=> fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
      body:JSON.stringify(body)
    });
    let body={ model, messages, temperature, max_tokens:maxTokens };
    let r=await send(body);
    if(!r.ok && r.status===400){
      // Newer reasoning models rename max_tokens and lock temperature.
      const txt=await r.clone().text();
      if(/max_completion_tokens|max_tokens/.test(txt)||/temperature/.test(txt)){
        body={ model, messages, max_completion_tokens:maxTokens };
        r=await send(body);
      }
    }
    if(!r.ok) throw new Error(await friendlyHttp(r,'OpenAI'));
    const j=await r.json();
    return (j.choices?.[0]?.message?.content||'').trim();
  }

  if(p==='anthropic'){
    const key=A.keys.anthropic;
    if(!key) throw new Error('Add your Claude key in AI setup.');
    const model=A.model.anthropic;
    if(!model) throw new Error('Pick a Claude model in AI setup.');
    const system = messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
    let turns = messages.filter(m=>m.role!=='system')
                        .map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content}));
    // Claude requires an opening user turn and strict alternation.
    while(turns.length && turns[0].role!=='user') turns.shift();
    const merged=[];
    for(const t of turns){
      if(merged.length && merged[merged.length-1].role===t.role) merged[merged.length-1].content += '\n\n'+t.content;
      else merged.push({...t});
    }
    if(!merged.length) merged.push({role:'user',content:'Hello'});
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
               'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({ model, max_tokens:maxTokens, temperature, system:system||undefined, messages:merged })
    });
    if(!r.ok) throw new Error(await friendlyHttp(r,'Claude'));
    const j=await r.json();
    return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  }

  if(p==='gemini'){
    const key=A.keys.gemini;
    if(!key) throw new Error('Add your Gemini key in AI setup.');
    const model=A.model.gemini;
    if(!model) throw new Error('Pick a Gemini model in AI setup.');
    const system = messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
    const contents = messages.filter(m=>m.role!=='system').map(m=>({
      role: m.role==='assistant'?'model':'user', parts:[{text:m.content}]
    }));
    if(!contents.length) contents.push({role:'user',parts:[{text:'Hello'}]});
    const body={ contents, generationConfig:{ temperature, maxOutputTokens:maxTokens } };
    if(system) body.systemInstruction={ parts:[{text:system}] };
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+
      encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if(!r.ok) throw new Error(await friendlyHttp(r,'Gemini'));
    const j=await r.json();
    const parts = j.candidates?.[0]?.content?.parts||[];
    return parts.map(x=>x.text||'').join('').trim();
  }

  throw new Error('No AI provider selected.');
};

/**
 * Public entry point. If a local provider dies mid-run and an OpenAI key is
 * already available, switch over and retry once rather than losing the turn.
 */
AI.chat = async function(messages, opts){
  const A=S.ai, from=A.provider;
  try{
    return await AI._chatRaw(messages, opts);
  }catch(err){
    const local = (from==='ollama' || from==='webllm');
    const key   = A.keys.openai || KeyVault.get('openai');
    if(!local || !key) throw err;

    A.keys.openai=key;
    A.provider='openai';
    A.chain='openai';
    A.chainNote=PROVIDERS[from].name+' failed during a request, so the app switched to the OpenAI API.';
    A.error[from]=err.message||String(err);
    updateAIStatus(); saveLocalSoon();
    toast(PROVIDERS[from].name+' stopped responding — continuing on OpenAI.','warn',5500);
    try{
      return await AI._chatRaw(messages, opts);
    }catch(err2){
      A.provider=from;               // put it back so the error reads honestly
      updateAIStatus();
      throw err2;
    }
  }
};

AI.canImage = function(){

};
AI.imageHint = function(){
  const p=S.ai.provider;
  if(p==='openai'||p==='gemini') return 'Add a '+PROVIDERS[p].name+' key to generate images.';
  return 'Picture generation needs OpenAI or Gemini. '+PROVIDERS[p].name+' can still hold the conversation.';

AI.image = async function(prompt, characterContext){
  const enhanced = characterContext
    ? 'Historical illustration in the style of '+characterContext+': '+prompt
    : prompt;
  const A=S.ai, p=A.provider;

  if(p==='openai'){
    const key=A.keys.openai;
    if(!key) throw new Error('Add your OpenAI key to generate pictures.');
    let model='gpt-image-1';
    try{ model = selectImageModel(await openaiRawModels()); }catch(e){}
    const body={ model, prompt:enhanced, n:1, size:'1024x1024' };
    const usesBase64 = model.startsWith('gpt-image-');
    if(usesBase64) body.quality='auto';
    else if(model==='dall-e-3') body.quality='standard';
    const r = await fetch('https://api.openai.com/v1/images/generations',{
      method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
      body:JSON.stringify(body)
    });
    if(!r.ok) throw new Error(await friendlyHttp(r,'OpenAI images'));
    const j=await r.json();
    if(usesBase64){
      const b64=j.data?.[0]?.b64_json;
      if(!b64) throw new Error('OpenAI returned no image data.');
      return 'data:image/png;base64,'+b64;
    }
    const url=j.data?.[0]?.url;
    if(!url) throw new Error('OpenAI returned no image.');
    return url;
  }

  if(p==='gemini'){
    const key=A.keys.gemini;
    if(!key) throw new Error('Add your Gemini key to generate pictures.');
    const list=A.models.gemini||[];
    const imgModel = (list.find(m=>/image/i.test(m.id) && !/imagen/i.test(m.id))||{}).id
                   || 'gemini-2.5-flash-image';
    let r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+
      encodeURIComponent(imgModel)+':generateContent?key='+encodeURIComponent(key),{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ contents:[{role:'user',parts:[{text:enhanced}]}] })
    });
    if(r.ok){
      const j=await r.json();
      const parts=j.candidates?.[0]?.content?.parts||[];
      const inline=parts.find(x=>x.inlineData||x.inline_data);
      if(inline){
        const d=inline.inlineData||inline.inline_data;
        return 'data:'+(d.mimeType||d.mime_type||'image/png')+';base64,'+d.data;
      }
    }
    // Fall back to an Imagen predict endpoint if one is available on this key.
    const imagen=(list.find(m=>/imagen/i.test(m.id))||{}).id;
    if(imagen){
      const r2 = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+
        encodeURIComponent(imagen)+':predict?key='+encodeURIComponent(key),{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ instances:[{prompt:enhanced}], parameters:{sampleCount:1} })
      });
      if(r2.ok){
        const j2=await r2.json();
        const b64=j2.predictions?.[0]?.bytesBase64Encoded;
        if(b64) return 'data:image/png;base64,'+b64;
      }
    }
    throw new Error('This Gemini key has no image model available.');
  }

  throw new Error(AI.imageHint());
};

let _voicesCache=[];
function systemVoices(){
  if(!window.speechSynthesis) return [];
  const v=speechSynthesis.getVoices();
  if(v&&v.length) _voicesCache=v;
  return _voicesCache;
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>systemVoices();

/** Map the six studio voice names onto whatever the browser actually has. */
function matchSystemVoice(id){
  const vs=systemVoices(); if(!vs.length) return null;
  const en=vs.filter(v=>/^en/i.test(v.lang));
  const pool=en.length?en:vs;
  const want=VOICE_OPTIONS.find(v=>v.value===id)||{gender:'neutral'};
  const female=/female|woman|zira|samantha|karen|moira|tessa|fiona|serena|victoria|aria|jenny|libby|sonia|catherine|google uk english female|google us english/i;
  const male=/male|man|david|daniel|alex|fred|george|guy|ryan|thomas|arthur|google uk english male/i;
  if(id==='fable'){ const uk=pool.find(v=>/en-GB/i.test(v.lang)); if(uk) return uk; }
  if(want.gender==='female'){ const f=pool.find(v=>female.test(v.name)); if(f) return f; }
  if(want.gender==='male'){ const m=pool.find(v=>male.test(v.name)); if(m) return m; }
  const idx=VOICE_OPTIONS.findIndex(v=>v.value===id);
  return pool[idx % pool.length] || pool[0];
}
AI.stopSpeech = function(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(S.chat.audio){ try{ S.chat.audio.pause(); }catch(e){} }

/** Speak text; resolves once playback starts. */
AI.speak = async function(text, voiceId, speed, volume){
  const A=S.ai;
  if(A.provider==='openai' && A.keys.openai){
    let model='tts-1';
    try{ model=selectTtsModel(await openaiRawModels()); }catch(e){}
    const r = await fetch('https://api.openai.com/v1/audio/speech',{
      method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+A.keys.openai},
      body:JSON.stringify({ model, input:text.slice(0,4000), voice:voiceId||'alloy', speed:speed||1.0 })
    });
    if(!r.ok) throw new Error(await friendlyHttp(r,'OpenAI speech'));
    const buf=await r.arrayBuffer();
    const url=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));
    const audio=new Audio(url);
    audio.volume = volume==null?1:volume;
    audio.onended=()=>{ S.chat.playing=false; S.chat.audio=null; URL.revokeObjectURL(url); paintChatControls(); };
    await audio.play();
    S.chat.audio=audio; S.chat.playing=true; paintChatControls();
    return;
  }
  // Browser voice — always available, works offline.
  if(!window.speechSynthesis) throw new Error('This browser has no speech synthesis.');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=matchSystemVoice(voiceId);
  if(v) u.voice=v;
  u.rate = Math.max(0.5, Math.min(2, speed||1));
  u.volume = volume==null?1:volume;
  u.pitch = 1;
  return new Promise((resolve,reject)=>{
    u.onstart=()=>{ S.chat.playing=true; paintChatControls(); resolve(); };
    u.onend=()=>{ S.chat.playing=false; paintChatControls(); };
    u.onerror=(e)=>{ S.chat.playing=false; paintChatControls(); reject(new Error('Speech playback failed.')); };
    speechSynthesis.speak(u);
    setTimeout(resolve,400);
  });
};

/** Probe Ollama once at startup so the default provider is honest. */
async function probeOllama(){
  for(const base of ollamaBases()){
    try{
      const ctl=new AbortController();
      const t=setTimeout(()=>ctl.abort(),2500);
      const r=await localFetch(base+'/api/tags',{signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const j=await r.json();
      noteOllamaBase(base);
      S.ai.models.ollama=(j.models||[]).map(m=>({id:m.name,label:m.name,
        note:m.details?.parameter_size||''}));
      S.ai.ollamaUp = true;
      if(!S.ai.model.ollama && S.ai.models.ollama.length) S.ai.model.ollama=S.ai.models.ollama[0].id;
      return true;
    }catch(e){ /* try the next address */ }
  }
  S.ai.ollamaUp=false;
  return false;
}

/** Probe WebLLM: needs WebGPU, a real adapter, and the runtime module. */
async function probeWebLLM(){
  try{
    if(!navigator.gpu) throw new Error('no WebGPU');
    const adapter = await Promise.race([
      navigator.gpu.requestAdapter(),
      new Promise(r=>setTimeout(()=>r(null), 3000))
    ]);
    if(!adapter) throw new Error('no GPU adapter');
    await Promise.race([
      loadWebLLM(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('runtime timed out')), 6000))
    ]);
    S.ai.webllmUp=true;
    if(!S.ai.model.webllm) S.ai.model.webllm = WEBLLM_SUGGESTED[0];
    return true;
  }catch(e){
    S.ai.webllmUp=false;
    return false;
  }
}

/**
 * The fallback ladder, in order:
 *   1. Ollama   — local server, no key, nothing leaves the machine
 *   2. WebLLM   — in-browser model, no key, needs WebGPU + one download
 *   3. OpenAI   — cloud, needs a key; taken from the shared vault if present,
 *                 otherwise the user is asked for one.
 * A provider the user picked by hand (S.ai.pinned) is never overridden.
 */
async function autoSelectProvider(){
  const A=S.ai;

  if(A.pinned){
    if(A.provider==='ollama') await probeOllama();
    if(A.provider==='openai' && !A.keys.openai){
      const k=KeyVault.get('openai');
      if(k) A.keys.openai=k; else openModal('key',{ reason:'pinned' });
    }
    updateAIStatus();
    return;
  }

  /* --- rung 1: Ollama --- */
  const ollamaUp = await probeOllama();
  const ollamaModels = (A.models.ollama||[]).length;
  if(ollamaUp && ollamaModels){
    A.provider='ollama'; A.chain='ollama';
    A.chainNote='Ollama is running on this machine, so the conversation stays local.';
    updateAIStatus(); saveLocalSoon();
    return;
  }

  /* --- rung 2: WebLLM --- */
  const webUp = await probeWebLLM();
  if(webUp){
    A.provider='webllm'; A.chain='webllm';
    A.chainNote = ollamaUp
      ? 'Ollama is running but has no models pulled, so WebLLM is loaded instead. It runs inside this tab.'
      : 'Ollama is not reachable, so WebLLM is loaded instead. It runs inside this tab.';
    updateAIStatus(); saveLocalSoon();
    toast(A.chainNote+' Change it any time in AI setup.','warn',6500);
    return;
  }

  /* --- rung 3: OpenAI --- */
  A.provider='openai'; A.chain='openai';
  A.chainNote = (ollamaUp && !ollamaModels
      ? 'Ollama is running but no models are pulled, and WebLLM cannot start in this browser. '
      : 'Ollama is not reachable and WebLLM cannot start in this browser. ')
    + 'The app has fallen back to the OpenAI API.';
  const key = A.keys.openai || KeyVault.get('openai');
  if(key){
    A.keys.openai=key;
    updateAIStatus(); saveLocalSoon();
    toast('No local model found — using your saved OpenAI key.','warn',6000);
    try{ await AI.listModels('openai',true); }catch(e){}
    updateAIStatus(); renderModals(); saveLocalSoon();
  }else{
    updateAIStatus(); saveLocalSoon();
    openModal('key',{ reason:'fallback' });
  }
}

let _pdfjs=null;
async function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  const CDN='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/';
  try{
    const mod = await import(CDN+'pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc = CDN+'pdf.worker.min.mjs';
    _pdfjs=mod; return mod;
  }catch(e){
    throw new Error('The PDF reader could not load. It needs one internet connection the first time; the rest of the app works offline.');
  }
}
const PDFProcessor = {
  validateFile(file){
    const maxSize=10*1024*1024;
    if(file.type!=='application/pdf' && !/\.pdf$/i.test(file.name))
      return { isValid:false, error:'Only PDF files are allowed' };
    if(file.size>maxSize) return { isValid:false, error:'File size must be less than 10MB' };
    return { isValid:true };
  },
  async extractTextFromFile(file){
    const pdfjsLib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
    let full='';
    const numPages=pdf.numPages;
    let meta={};
    try{ meta = await pdf.getMetadata(); }catch(e){}
    for(let i=1;i<=numPages;i++){
      const page=await pdf.getPage(i);
      const tc=await page.getTextContent();
      full += tc.items.map(it=>it.str).join(' ')+'\n';
    }
    return { text:full.trim(), numPages, title:meta.info?.Title, author:meta.info?.Author };
  }
};
const ImageProcessor = {
  validateImageFile(file){
    const maxSize=10*1024*1024;
    const ok=['image/jpeg','image/jpg','image/png','image/webp'];
    if(!ok.includes(file.type)) return { isValid:false, error:'Only JPEG, PNG, and WebP images are allowed' };
    if(file.size>maxSize) return { isValid:false, error:'Image size must be less than 10MB' };
    return { isValid:true };
  },
  processImageFile(file, maxWidth, quality){
    maxWidth=maxWidth||800; quality=quality||0.8;
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const c=document.createElement('canvas');
          const ctx=c.getContext('2d');
          if(!ctx) return reject(new Error('Failed to get canvas context'));
          let w=img.width,h=img.height;
          if(w>maxWidth){ h=(h*maxWidth)/w; w=maxWidth; }
          c.width=w; c.height=h;
          ctx.drawImage(img,0,0,w,h);
          const dataUrl=c.toDataURL('image/jpeg',quality);
          resolve({ dataUrl, originalName:file.name, size:dataUrl.length, dimensions:{width:w,height:h} });
        };
        img.onerror=()=>reject(new Error('Failed to load image'));
        img.src=ev.target.result;
      };
      reader.onerror=()=>reject(new Error('Failed to read file'));
      reader.readAsDataURL(file);
    });
  }
};
/** Turn a remote image into a data URL so saved JSON keeps working offline. */
async function inlineImage(url){
  if(!url || url.startsWith('data:')) return url;
  try{
    const r=await fetch(url); if(!r.ok) throw new Error();
    const blob=await r.blob();
    return await new Promise((res,rej)=>{
      const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob);
    });
  }catch(e){ return url; }
}

/* Field hygiene: a blank box the teacher can type into beats a wrong one. */
/**
 * True when a value is clearly a scrap of markup rather than a real answer —
 * "and Roles:**", "[Nationality]", a bare heading. Used to scrub values that
 * were stored by an earlier session, so old mistakes do not come back.
 */
function looksLikeJunk(v){
  const s=String(v==null?'':v).trim();
  if(!s) return false;
  return /\*\*|^_{2}|^#|:\s*$|^\[.*\]$|^(and|or|of|the)\b/i.test(s);
}
function scrubForm(f){
  const out={ name:'', timePeriod:'', occupation:'', nationality:'', birthYear:'', deathYear:'' };
  if(!f) return out;
  ['name','timePeriod','occupation','nationality'].forEach(k=>{
    const v=String(f[k]==null?'':f[k]).replace(/[*_`]/g,'').trim();
    out[k]= looksLikeJunk(f[k]) ? '' : v;
  });
  out.birthYear = cleanYear(f.birthYear);
  out.deathYear = cleanYear(f.deathYear);
  return out;
}
function cleanField(v, maxLen){
  if(v==null) return '';
  let s=String(v).replace(/[*_`]/g,'').replace(/^[\s#>\-\u2022]+/,'').replace(/\s+/g,' ').trim();
  s=s.replace(/^[:\-\u2013\u2014]+\s*/,'').trim();
  if(!s) return '';
  if(/^\[.*\]$/.test(s)) return '';                       // untouched template placeholder
  if(/:$/.test(s)) return '';                             // caught a heading, not a value
  if(/^(and|or|of|in|the|a|an)\b/i.test(s)) return '';    // caught the tail of a heading
  if(/^(n\/?a|unknown|none|not applicable)$/i.test(s)) return '';
  s=s.replace(/[.,;:]+$/,'').trim();
  if(!s || s.length>(maxLen||90)) return '';
  return s;
}
/* Pull a year out of prose like "14 March 1879 in Ulm" or "c. 356 BC". */
function cleanYear(v){
  if(v==null||v==='') return '';
  const s=String(v);
  if(/\b(living|present|alive|n\/?a)\b/i.test(s)) return '';
  const bc=/\b(BCE?|B\.C\.)\b/i.test(s);
  const m=s.match(/\b(\d{3,4})\b/) || s.match(/\b(\d{1,4})\b/);
  if(!m) return '';
  const y=parseInt(m[1],10);
  if(!y) return '';
  if(!bc && y>new Date().getFullYear()+1) return '';
  return bc ? '-'+y : String(y);
}
/* Read "Label: value" from its own line, tolerating markdown and numbering. */
function fieldFromLines(text, labelPattern, maxLen){
  const lines=String(text||'').split(/\r?\n/);
  const re=new RegExp('^\\s*(?:\\d+[.)]\\s*)?(?:'+labelPattern+')\\s*:\\s*(.+)$','i');
  for(const raw of lines){
    const line=raw.replace(/[*_`#]/g,'').trim();
    if(!line) continue;
    const m=line.match(re);
    if(m){
      const val=cleanField(m[1],maxLen);
      if(val) return val;
    }
  }
  return '';
}
function extractBasicInfoFromResearch(content, name){
  const info={ name };
  const txt=String(content||'');

  const fullName=fieldFromLines(txt,'Full Name|Name',80);
  if(fullName) info.name=fullName;

  info.birthYear = cleanYear(fieldFromLines(txt,'Born|Birth Year|Date of Birth|Birth',60));
  info.deathYear = cleanYear(fieldFromLines(txt,'Died|Death Year|Date of Death|Death',60));
  if(!info.birthYear || !info.deathYear){
    // "(1879–1955)" beside the name is the other common shape
    const span=txt.match(/\((?:c\.?\s*)?(\d{3,4})\s*[-\u2013\u2014]\s*(\d{3,4})\)/);
    if(span){ info.birthYear=info.birthYear||span[1]; info.deathYear=info.deathYear||span[2]; }
  }
  info.nationality = fieldFromLines(txt,'Nationality|Citizenship',60);
  info.occupation  = fieldFromLines(txt,'Occupation|Primary occupation|Primary role|Profession|Role',80);
  info.timePeriod  = fieldFromLines(txt,'Historical Period|Time Period|Period|Era',80);

  Object.keys(info).forEach(k=>{ if(!info[k]) delete info[k]; });
  if(!info.name) info.name=name;
  return info;
}

  const on = (tint, art, floor) =>
    'linear-gradient('+tint+'), url("'+art+'") center/cover, linear-gradient('+floor+')';
  const flat = (tint, floor) => 'linear-gradient('+tint+'), linear-gradient('+floor+')';

  if(name.includes('jesus')||name.includes('christ')||occ.includes('messiah')||occ.includes('savior'))
    return flat('135deg, rgba(139,69,19,.72), rgba(160,82,45,.72)','135deg,#7a4a1e,#a0522d');
  if(period.includes('ancient')||period.includes('roman')||period.includes('greek')||period.includes('egyptian'))
    return on('135deg, rgba(101,67,33,.78), rgba(139,69,19,.78)', ART.HERO, '135deg,#654321,#8b4513');
  if(period.includes('medieval')||period.includes('middle ages')||occ.includes('king')||occ.includes('queen'))
    return on('135deg, rgba(45,40,90,.76), rgba(70,60,120,.76)', ART.CASTLE, '135deg,#312a5c,#4b4270');
  if(period.includes('renaissance')||name.includes('leonardo')||name.includes('michelangelo'))
    return on('135deg, rgba(120,53,15,.78), rgba(146,64,14,.78)', ART.CARDHIST, '135deg,#78350f,#92400e');
  if(nat.includes('chinese')||nat.includes('japanese')||nat.includes('asian'))
    return flat('135deg, rgba(127,29,29,.75), rgba(153,27,27,.75)','135deg,#7f1d1d,#991b1b');
  return on('150deg, rgba(12,16,44,.80), rgba(28,22,64,.80)', ART.HERO, '160deg,#060a1c,#120e33');
}
