# History chatbot (history.teachingtools.dev). Static: index.html is a single-file build.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://teachingtools.dev https://www.teachingtools.dev https://eduai-desktop.netlify.app"

[[headers]]
  for = "/eduai-connect.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
